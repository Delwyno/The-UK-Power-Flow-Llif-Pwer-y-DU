const SIM_K={imp:50,cfOff:.40,cfOn:.27,batH:2,ldH:8,etaB:.85,etaL:.75,exp:.6,gas:394,bio:120,oth:300,lcd:50,gasHeavy:.25};
const SIM_SL=[['off',0,90,1],['on',0,45,1],['solar',0,90,1],['nuclear',0,10,.1],['bat',0,50,1],['ldes',0,20,.5],['ic',0,30,.5],['lcd',0,20,.5],['dem',-10,40,1]];
const SIM_RANGE={off:[43,50],on:[27,29],solar:[45,47],nuclear:[3,4],bat:[23,27],ldes:[4,6],ic:[12,14],dem:[10,12]};
const SIM_PRESETS={ffr:{off:51,on:27,solar:47,nuclear:4,bat:27,ldes:8,ic:12,lcd:0,dem:11},nd:{off:43,on:27,solar:47,nuclear:4,bat:23,ldes:5,ic:12,lcd:3,dem:11}};
const S_SIM={data:null,loading:false,err:null,v:null,preset:'ffr',res:null,base:null};
const B64I=(()=>{ const m=new Int16Array(128); 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'.split('').forEach((c,i)=>m[c.charCodeAt(0)]=i); return m; })();
function unpack(s,u){ const n=s.length>>1, a=new Float32Array(n); for(let i=0;i<n;i++) a[i]=((B64I[s.charCodeAt(2*i)]<<6)|B64I[s.charCodeAt(2*i+1)])*u; return a; }
const simBase = () => { const c=S_SIM.data.cap; return {off:c.off,on:c.on,solar:c.solar,nuclear:c.nuclear,bat:c.bat,ldes:c.ldes,ic:c.ic,lcd:0,dem:0}; };
async function loadSim(){
  const P=S_SIM; if(P.data||P.loading||P.err) return; P.loading=true;
  try{
    let j=SIM_INLINE;
    if(!j){ const r=await fetch('data/sim.json',{cache:'no-cache'}); if(!r.ok) throw new Error('fetch'); j=await r.json(); }
    if(!j||!j.s||!j.s.d){ P.err='nodata'; }
    else { const s={}; for(const k in j.s) s[k]=unpack(j.s[k],j.unit); P.data={...j,s}; P.base=simRun(P.data,simBase()); P.v=P.v||{...SIM_PRESETS.ffr}; P.res=simRun(P.data,P.v); }

}
function simRun(D,v){
  const c=D.cap, s=D.s, H=D.hours, K=SIM_K;
  const kW=(v.off*K.cfOff+v.on*K.cfOn)/(c.off*K.cfOff+c.on*K.cfOn), kS=v.solar/c.solar, kN=v.nuclear/c.nuclear, kD=1+v.dem/100, kI=v.ic/c.ic;
  const bP=v.bat*1e3, bE=bP*K.batH, lP=v.ldes*1e3, lE=lP*K.ldH, xP=v.ic*1e3*K.exp, cP=v.lcd*1e3;
  let sb=bE/2, sl=lE/2;
  const T={gen:0,clean:0,gas:0,curt:0,ws:0,exp:0,imp:0,dem:0,h50:0,gasH:0};
  const nd=Math.floor(H/24), daily=new Float32Array(nd), dgas=new Float32Array(nd), dcurt=new Float32Array(nd);
  let run=0, runStart=0, best={len:0,start:0};
  for(let h=0;h<H;h++){
    const d=s.d[h]*kD, ws=s.w[h]*kW+s.so[h]*kS, n=s.n[h]*kN, b=s.b[h], hy=s.hy[h], ot=s.ot[h];
    let r=d-(ws+n+b+hy+ot), wsU=ws, nU=n, gas=0, lc=0, cu=0, im=0;
    if(r<0){ let sur=-r, x;
      x=Math.min(sur,bP,(bE-sb)/K.etaB); sb+=x*K.etaB; sur-=x;
      x=Math.min(sur,lP,(lE-sl)/K.etaL); sl+=x*K.etaL; sur-=x;
      x=Math.min(sur,xP); T.exp+=x; sur-=x;
      cu=sur; wsU=Math.max(0,ws-sur); nU=n-Math.max(0,sur-ws); T.curt+=Math.min(sur,ws);
    } else { let x;
      x=Math.min(r,bP,sb); sb-=x; r-=x;
      x=Math.min(r,lP,sl); sl-=x; r-=x;
      lc=Math.min(r,cP); r-=lc;
      x=Math.min(r,s.im[h]*kI); T.imp+=x; r-=x; im=x;
      gas=r;
    }
    const clean=wsU+nU+b+hy+lc, gen=clean+gas+ot, em=gas*K.gas+b*K.bio+ot*K.oth+lc*K.lcd+im*K.imp, ci=gen+im>0?em/(gen+im):0;
    T.gen+=gen; T.clean+=clean; T.gas+=gas; T.ws+=ws; T.dem+=d; if(ci<=50) T.h50++; if(gas>500) T.gasH++;
    const di=Math.floor(h/24); if(di<nd){ daily[di]+=ci/24; dgas[di]+=gas; dcurt[di]+=Math.min(cu,ws); }
    if(gen>0&&gas/gen>=K.gasHeavy){ if(!run) runStart=h; run++; if(run>best.len) best={len:run,start:runStart}; } else run=0;
  }
  const ciMean=d3.mean(daily);
  return {ci:ciMean, cleanShare:T.clean/T.gen*100, cleanDem:T.clean/T.dem*100, gas:T.gas/1e6, curt:T.curt/1e6, curtPct:T.ws?T.curt/T.ws*100:0,
    exp:T.exp/1e6, imp:T.imp/1e6, h50:T.h50/H*100, gasH:T.gasH/H*100, spell:best, daily, dgas, dcurt};
}

/* ======================= weekly digest ======================= */
const EN_DF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], CY_DF=['dydd Sul','dydd Llun','dydd Mawrth','dydd Mercher','dydd Iau','dydd Gwener','dydd Sadwrn'];
const dayName = ds => (LANG==='cy'?CY_DF:EN_DF)[new Date(ds+'T12:00:00Z').getUTCDay()];
const addDays = (ds,n) => new Date(Date.parse(ds+'T12:00:00Z')+n*864e5).toISOString().slice(0,10);
function dgWeek(){ const W=(DIGEST.weeks||[]).map(w=>{ const e=addDays(w.start,6); return {...w,days:w.days.filter(d=>d[0]>=w.start&&d[0]<=e)}; }); if(!W.length) return null;
  const i=S.dw==null?W.length-1:Math.max(0,Math.min(W.length-1,S.dw)); return {w:W[i],i,W}; }
function dgRange(w){ const e=addDays(w.start,6), a=fmtDate(w.start), z=fmtDate(e);
  return w.start.slice(5,7)===e.slice(5,7) ? `${a.split(' ')[0]}–${z} ${e.slice(0,4)}` : `${a} – ${z} ${e.slice(0,4)}`; }
function dgFacts(x){
  const {w,i,W}=x, out=[];
  const prev=W[i-1]&&W[i-1].start===addDays(w.start,-7)?W[i-1]:null;
  let cmp=''; if(prev){ const p=Math.round((w.ci-prev.ci)/prev.ci*100); cmp=Math.abs(p)<3?tr('dg_same'):tr(p<0?'dg_cleaner':'dg_dirtier',{p:Math.abs(p)}); }
  out.push(tr('dg_s1',{ci:w.ci,cmp}));
  if(w.mix){ const pk=w.pk&&w.pk.wind; out.push(tr('dg_s2',{w:Math.round(w.mix.wind),pk:pk?pk[0]:'–',when:pk?fmtWhen(pk[1]):''})); }
  const lo=w.days.reduce((a,b)=>b[1]<a[1]?b:a), hi=w.days.reduce((a,b)=>b[1]>a[1]?b:a);
  out.push(tr('dg_s3',{d1:dayName(lo[0]),v1:lo[1],d2:dayName(hi[0]),v2:hi[1]}));
  out.push(w.h50>0?tr('dg_s4',{h:Math.round(w.h50)}):tr('dg_s4n'));
  if(w.reg){ const rs=REG.map(r=>[r,w.reg[r[0]]]).filter(e=>e[1]!=null).sort((a,b)=>a[1]-b[1]);
    if(rs.length){ const r=rs[0], wv=w.reg['17']; let s=tr('dg_s5',{r:LANG==='cy'?r[0][2]:r[0][1],v:r[1]});
      if(wv!=null){ const p=Math.round((wv-w.ci)/w.ci*100); s+=' '+(Math.abs(p)<3?tr('dg_wal0',{v:wv}):tr(p<0?'dg_wal_lo':'dg_wal_hi',{v:wv,p:Math.abs(p)})); }
      out.push(s); } }
  const [yy,mm]=w.start.split('-').map(Number), ly=CI_MON.find(d=>d[0]===yy-1&&d[1]===mm);
  if(ly) out.push(tr('dg_ly',{v:ly[2],m:fmtDate(w.start).replace(/^\d+ /,''),y:yy-1}));
  const rec=[];
  if(W.length>=6&&w.ci===Math.min(...W.map(z=>z.ci))) rec.push(tr('dg_rec',{d:fmtDate(W[0].start)+' '+W[0].start.slice(0,4)}));
  if(HISTORY.record&&w.min[0]<HISTORY.record.v) rec.push(tr('dg_rec_hh',{v:w.min[0]}));
  return {out,rec,lo,hi};
}
function digestBlock(){
  const x=dgWeek();
  if(!x) return `<div class="digest"><h3>${tr('dg_h')}</h3><p class="meta">${tr('dg_none')}</p></div>`;
  const {w,i,W}=x, F=dgFacts(x);
  let h=`<div class="digest"><div class="dghead"><div><h2>${i===W.length-1?tr('dg_h'):tr('dg_h_old')}</h2><div class="meta">${dgRange(w)}</div></div>
    <div class="dgnav"><button class="xbtn" data-dg="-1" aria-label="${tr('dg_prev')}" ${i===0?'disabled':''}>‹</button><button class="xbtn" data-dg="1" aria-label="${tr('dg_next')}" ${i===W.length-1?'disabled':''}>›</button></div></div>
    <div class="cibig"><div><b>${w.ci}</b><small>gCO₂/kWh</small><span><i class="rdot" style="--c:${CI_IDX_COL[ciIndex(w.ci)]}"></i>${tr('dg_avg')}</span></div>
    <div><b>${Math.round(w.h50)}</b><small>${tr('dg_hours')}</small><span>${tr('dg_at50')}</span></div>
    <div><b>${w.mix?Math.round(w.mix.wind)+'%':'–'}</b><small>${tr('dg_ofgen')}</small><span>${tr('fuel_wind')}</span></div></div>

  let off=0; const total=d3.sum(days,d=>d.h);
  days.forEach(d=>{ const t0=Date.parse(d.from);
    for(let i=0;i<d.h;i++) t.push(t0+i*36e5);
    for(const id in d.s){ const o=st[id]||(st[id]={pn:new Float32Array(total).fill(NaN),cu:new Float32Array(total)});
      const pn=unpack(d.s[id][0],J.unit), cu=unpack(d.s[id][1],J.unit);
      for(let i=0;i<d.h;i++){ o.pn[off+i]=pn[i]; o.cu[off+i]=cu[i]; } }
    off+=d.h; });
  const out=new Float32Array(total), cut=new Float32Array(total);
  for(const id in st){ const s=st[id], site=SITES.find(z=>z.id===id), wind=site&&(site.t==='ow'||site.t==='nw');
    for(let i=0;i<total;i++){ if(!isNaN(s.pn[i])) out[i]+=Math.max(0,s.pn[i]-s.cu[i]); if(wind) cut[i]+=s.cu[i]; } }

/* ======================= what if: an electrolyser at a wind farm ======================= */
const EH_KWH_PER_KG = 55;
function ehSeries(id){
  const J=HIST.sta; if(!J||!J.days) return null; const t=[], cu=[]; let days=0;
  J.days.forEach(d=>{ const o=d.s[id]; if(!o) return; const c=unpack(o[1],J.unit), t0=Date.parse(d.from); days++;
    for(let i=0;i<d.h;i++){ t.push(t0+i*36e5); cu.push(c[i]); } });
  return t.length?{t,cu,days}:null;
}
function ehFarms(){
  const J=HIST.sta; if(!J||!J.days) return []; const tot={};
  J.days.forEach(d=>{ for(const id in d.s){ const s=SITES.find(z=>z.id===id); if(!s||(s.t!=='ow'&&s.t!=='nw')) continue; tot[id]=(tot[id]||0)+d3.sum(unpack(d.s[id][1],J.unit)); } });
  return Object.entries(tot).filter(e=>e[1]>=50).map(([id,mwh])=>({s:SITES.find(z=>z.id===id),mwh})).sort((a,b)=>b.mwh-a.mwh);
}
function ehCalc(id,mw){
  const r=ehSeries(id); if(!r) return null; const n=r.cu.length; let abs=0, tot=0;
  r.cu.forEach(v=>{ tot+=v; abs+=Math.min(mw,v); });
  const price=(farmPrices(14)[id]||{}).p;
  return {t:r.t,cu:r.cu,days:r.days,n,tot,abs,mw,lf:abs/(mw*n),h2t:abs/EH_KWH_PER_KG,co2:abs*0.394,gbp:price!=null?abs*price:null,share:tot?abs/tot*100:0};
}
function ehBlock(){
  const ready=need(['sta','cur'],()=>{ if(S.tab==='hydrogen'&&!S.h2sel) rerender(); });
  let h=`<h3>${tr('eh_h')}</h3><p>${tr('eh_t')}</p>`;
  if(!ready) return h+`<p class="meta">${tr('sh_loading')}</p>`;
  const F=ehFarms(); if(!F.length) return h+`<p class="meta">${tr(location.protocol.startsWith('http')?'eh_none':'sh_offline')}</p>`;
  if(!S.ef||!F.some(f=>f.s.id===S.ef)) S.ef=F[0].s.id; if(!S.em) S.em=50;
  return h+`<div class="ehctl"><label for="ehfarm">${tr('eh_farm')}</label><select id="ehfarm">${F.map(f=>`<option value="${f.s.id}" ${f.s.id===S.ef?'selected':''}>${nm(f.s)} (${fmtGWh(f.mwh)})</option>`).join('')}</select>
    <label for="ehmw">${tr('eh_size')}</label><div class="ehsl"><input type="range" id="ehmw" min="5" max="200" step="5" value="${S.em}"><output id="ehmwo" for="ehmw">${S.em} MW</output></div></div><div id="ehres" aria-live="polite"></div>`;
}
function ehRender(){
  const el=document.getElementById('ehres'); if(!el) return; const R=ehCalc(S.ef,S.em); if(!R){ el.innerHTML=''; return; }
  const big=ehCalc(S.ef,S.em*2), more=R.abs>0?Math.round((big.abs/R.abs-1)*100):0, p=Math.round(R.lf*100);

const WALES_T = {pts:[[2016,43],[2022,59],[2024,54]], t2030:70, t2035:100, dem24:14.5, dem35:23.8, own:0.99, ownT:1.5, hp:31000, hpT:580000,
  src:'https://www.gov.wales/sites/default/files/publications/2026-08/energy-generation-use-wales-first-combined-edition.pdf'};

/* ======================= station history (site panel) ======================= */
function stationSeries(id,days=7){
  const J=HIST.sta; if(!J||!J.days||!J.days.length) return null;
  const pts=[]; let any=false;
  for(const d of J.days.slice(-days)){ const t0=Date.parse(d.from), s=d.s[id];
    const pn=s?unpack(s[0],J.unit):null, cu=s?unpack(s[1],J.unit):null;
    for(let i=0;i<d.h;i++){ const p=pn?pn[i]:null, c=cu?cu[i]:0; if(p!=null) any=true; pts.push({t:t0+i*36e5,pn:p,cu:c}); } }
  return any?pts:null;
}
function histBlock(d){
  if(!d.bmu||d.osm) return '';
  if(!need(['sta','cur'],()=>{ if(S.sel===d.key) rerender(); })) return `<h3>${tr('sh_h')}</h3><p class="meta">${tr('sh_loading')}</p>`;
  const pts=stationSeries(d.id);
  if(!pts) return HIST.sta&&HIST.sta.days&&HIST.sta.days.length?'':`<h3>${tr('sh_h')}</h3><p class="meta">${tr(location.protocol.startsWith('http')?'sh_none':'sh_offline')}</p>`;
  const ok=pts.filter(p=>p.pn!=null), out=ok.map(p=>Math.max(0,p.pn-p.cu)), avg=d3.mean(out), peak=d3.max(out), cut=d3.sum(ok,p=>p.cu);
  const wind=d.t==='ow'||d.t==='nw';
  let h=`<h3>${tr('sh_h')}</h3><div class="key"><span><i class="sq" style="background:${col(d.t)}"></i>${tr('sh_out')}</span>${cut>0?`<span><i class="sq" style="background:var(--warn)"></i>${tr('sh_cut')}</span>`:''}<span><i class="d"></i>${tr('cap')}</span></div><div class="chart" id="chhist"></div>`;
  h+=`<p class="meta">${tr('sh_sum',{a:fmtMW(avg),p:Math.round(avg/d.mw*100),m:fmtMW(peak)})}${cut>0?' '+tr('sh_cutsum',{v:fmtGWh(cut)}):''}</p>`;
  if(wind&&HIST.cur&&HIST.cur.days&&HIST.cur.days.length){ const last=HIST.cur.days.slice(-30).filter(x=>x.s), mine=last.map(x=>x.s[d.id]).filter(Boolean);

  h+=subsidyLine(d)+ehLink(d);
  h+=`<p class="fine">${tr('sh_note')} <button class="linkbtn inl" data-methods="history">${tr('m_link')}</button></p>`;

}

/* ======================= records and milestones (Stories) ======================= */
function recordsBlock(){
  const R=HISTORY.rec||{}, have=need(['day'],()=>{ if(S.tab==='stories'&&!S.sel) rerender(); });
  const D=(have&&HIST.day&&HIST.day.days)||[];
  // Britain-wide records all come from NESO's historic generation mix (one measure throughout).
  // Wales isn't in that dataset, so its row uses the live API's regional mix, compared only with itself.
  const wal=D.filter(x=>x.wales).reduce((b,x)=>!b||x.wales.h80>b.v?{v:x.wales.h80,t:x.d}:b,null);
  const rows=[['r_low',R.low,v=>v+' g'],['r_day',R.day,v=>v+' g'],['r_run',R.run50,v=>tr('r_hours',{h:(+v).toFixed(v%1?1:0)})],
    ['r_wind',R.wind,v=>Math.round(v)+'%'],['r_solar',R.solar,v=>Math.round(v)+'%']].filter(r=>r[1]&&r[1][0]!=null).map(r=>[r[0],{v:r[1][0],t:r[1][1]},r[2]]);
  if(wal&&wal.v>0) rows.push(['r_wales',wal,v=>tr('r_hours',{h:(+v).toFixed(v%1?1:0)})]);
  if(!rows.length) return '';
  const recent=t=>Date.now()-Date.parse(String(t).slice(0,10))<8*864e5;
  const when=t=>{ const s=String(t); return fmtDate(s.slice(0,10))+' '+s.slice(0,4); };
  let h=`<div class="story"><h3>${tr('r_h')}</h3><ul class="recs">${rows.map(([k,b,f])=>`<li><b>${f(b.v)}</b><span>${tr(k)}<small>${when(b.t)}${recent(b.t)?` <em>${tr('r_new')}</em>`:''}</small></span></li>`).join('')}</ul>`;
  const ms=milestones(D);
  if(ms.length) h+=`<h4>${tr('r_ms')}</h4><ul class="simtxt">${ms.map(m=>`<li><b>${fmtDate(m.d)}:</b> ${m.txt}</li>`).join('')}</ul>`;
  h+=`<p class="fine">${tr('r_note',{d:R.from?when(R.from):'2009',to:R.to?when(R.to):'–'})}${wal&&wal.v>0?' '+tr('r_note_w',{t:when(D[0].d)}):''} <button class="linkbtn inl" data-methods="records">${tr('m_link')}</button></p></div>`;
  return h;
}
function milestones(D){
  const cut=Date.now()-30*864e5, out=[];
  (HISTORY.ms||[]).forEach(m=>{ if(Date.parse(m.d)<cut) return;
    const v=m.k==='wind'||m.k==='solar'?Math.round(m.v):m.v;
    out.push({d:m.d,txt:tr('m_'+m.k,{v,h:m.v,s:m.s?fmtDate(m.s)+' '+m.s.slice(0,4):''})}); });
  let most=0;
  D.forEach((x,i)=>{ if(!x.wales) return; const h=x.wales.h80;
    if(h>=6&&Date.parse(x.d)>=cut) out.push({d:x.d,txt:h>most&&i>=30?tr('m_wales_rec',{h}):tr('m_wales',{h})});
    most=Math.max(most,h); });
  return out.sort((a,b)=>a.d<b.d?1:-1).slice(0,6);
}

/* ======================= shareable links ======================= */
function stateHash(){
  const p=new URLSearchParams();
  if(S.sel) p.set('s',S.sel); else { if(S.view==='wales') p.set('v','wales'); if(S.tab!=='map') p.set('t',S.tab); }
  if(S.year!==2026) p.set('y',S.year);
  if(!S.sel&&S.tab==='queue'){ if(S.qWales) p.set('qw','1'); if(S.qsel) p.set('qs',S.qsel); }
  if(!S.sel&&S.tab==='hydrogen'){ if(S.h2sel) p.set('hs',S.h2sel); if(S.efUser&&S.ef){ p.set('ef',S.ef); p.set('em',S.em); } }
  if(!S.sel&&S.tab==='sim'&&S_SIM.v) p.set('sim',SIM_SL.map(([k])=>S_SIM.v[k]).join('_'));
  if(!S.sel&&S.tab==='curtail'&&S.cu&&S.cu!=='farms') p.set('cu',S.cu);
  if(!S.sel&&S.tab==='stories'&&S.dw!=null&&DIGEST.weeks&&DIGEST.weeks[S.dw]) p.set('w',DIGEST.weeks[S.dw].start);
  if(LANG==='cy') p.set('l','cy');
  return p.toString();
}

const GC = {on:false, ready:false, q:[], last:null};
const GC_CODE = String((ANALYTICS&&ANALYTICS.goatcounter)||'').trim().toLowerCase();
const GC_CONFIGURED = /^[a-z0-9][a-z0-9-]*$/.test(GC_CODE);
(function startCounting(){
  if(!GC_CONFIGURED) return;
  const pv={en:['Privacy','<p>This site counts visits with GoatCounter, an open-source, privacy-friendly counter. It records which views and features are used (for example the Carbon tab, or a CSV download), plus the referring site, browser, screen size and a rough location. It sets no cookies and stores nothing on your device, and it does not keep your IP address: only a short-lived hash is used to tell visits apart. Nothing you type in the search box, including postcodes, is sent. If your browser sends Do Not Track or Global Privacy Control, nothing is counted. The numbers are used only to see what is useful.</p>'],
    cy:['Preifatrwydd','<p>Mae’r wefan hon yn cyfrif ymweliadau gyda GoatCounter, cownter ffynhonnell agored sy’n parchu preifatrwydd. Mae’n cofnodi pa olygon a nodweddion sy’n cael eu defnyddio (er enghraifft y tab Carbon, neu lawrlwytho CSV), ynghyd â’r wefan a’ch cyfeiriodd, y porwr, maint y sgrin a lleoliad bras. Nid yw’n gosod cwcis ac nid yw’n storio dim ar eich dyfais, ac nid yw’n cadw eich cyfeiriad IP: dim ond hash byrhoedlog a ddefnyddir i wahaniaethu rhwng ymweliadau. Ni chaiff dim a deipiwch yn y blwch chwilio, gan gynnwys codau post, ei anfon. Os yw eich porwr yn anfon Do Not Track neu Global Privacy Control, ni chaiff dim ei gyfrif. Defnyddir y rhifau i weld beth sy’n ddefnyddiol yn unig.</p>']};
  for(const l of ['en','cy']){ const secs=METHOD_DOC[l], i=secs.findIndex(s=>s[0]==='open'); secs.splice(i<0?secs.length:i,0,['privacy',pv[l][0],pv[l][1]]); }
  if(!location.protocol.startsWith('http')) return;                                                  // never from a local file
  if(navigator.doNotTrack==='1'||window.doNotTrack==='1'||navigator.globalPrivacyControl) return;    // respect Do Not Track and Global Privacy Control
  GC.on=true;
  window.goatcounter={no_onload:true, endpoint:'https://'+GC_CODE+'.goatcounter.com/count'};
  const s=document.createElement('script'); s.async=true; s.src='https://gc.zgo.at/count.js';
  s.onload=()=>{ GC.ready=true; GC.q.splice(0).forEach(v=>window.goatcounter.count(v)); };
  s.onerror=()=>{ GC.on=false; GC.q.length=0; };
  document.head.appendChild(s);
})();
function gcSend(v){ if(!GC.on) return; if(GC.ready) window.goatcounter.count(v); else if(GC.q.length<20) GC.q.push(v); }
function gcEvent(name,title){ gcSend({path:'event/'+name,title:title||name,event:true}); }
function gcView(){   // one pageview for each distinct screen: a tab, a site, Wales. Never the search box, a postcode or any typed text.
  if(!GC.on) return;
  let path='/'+S.tab, title=S.tab;
  if(S.sel){ const d=byId[S.sel]; path='/site/'+(d?d.id:'other'); title=d?nm(d):'Site'; }
  else if(S.view==='wales'){ path='/wales'; title='Wales'; }
  else if(S.tab==='hydrogen'&&S.h2sel){ path='/hydrogen/'+S.h2sel; title='Hydrogen: '+S.h2sel; }
  if(path===GC.last) return; GC.last=path;
  gcSend({path,title:tr('title')+' · '+title});
}

function applyHash(first){
  const p=new URLSearchParams(location.hash.slice(1)); if(![...p.keys()].length) return false;
  hashBusy=true;
  if(!first){ S.sel=null; S.view='overview'; S.tab='map'; }   // a new link replaces the whole view
  const t=p.get('t'); if(t&&['map','carbon','stories','curtail','plan','sim','compare','queue','hydrogen'].includes(t)) S.tab=t;
  if(S.tab==='curtail') S.cu=['costs','farms','why'].includes(p.get('cu'))?p.get('cu'):'farms';
  if(S.tab==='queue'){ S.fut='queue'; S.qWales=p.get('qw')==='1'; S.qsel=p.get('qs')||null; }
  if(S.tab==='hydrogen'){ S.fut='hydrogen'; S.h2sel=p.get('hs')||null; if(p.get('ef')){ S.ef=p.get('ef'); S.em=Math.max(5,Math.min(200,Math.round((+p.get('em')||50)/5)*5)); S.efUser=true; } }
  if(p.get('v')==='wales') S.view='wales';
  const y=+p.get('y'); if(y>=2026&&y<=2040){ S.year=y; const yr=document.getElementById('yr'); if(yr){ yr.value=y; updYear(); } }
  const sim=p.get('sim'); if(sim){ const v=sim.split('_').map(Number); if(v.length===SIM_SL.length&&v.every(n=>!isNaN(n))){ S_SIM.v={}; SIM_SL.forEach(([k],i)=>S_SIM.v[k]=v[i]); S_SIM.preset=null; } }
  const w=p.get('w'); if(w&&DIGEST.weeks){ const i=DIGEST.weeks.findIndex(x=>x.start===w); if(i>=0) S.dw=i; }
  if(p.get('l')==='cy'&&LANG!=='cy'&&first){ LANG='cy'; buildChrome(); }
  const s=p.get('s'); hashBusy=false;
  if(s&&byId[s]) { select(s); return true; }
  if(s&&/^(osm|sub)\d+$/.test(s)) S.pendingSel=s;
  render(); panel(); return true;
}

function saveChart(el,kind){
  const sv=el.querySelector('svg'); if(!sv) return;
  const clone=sv.cloneNode(true), src=sv.querySelectorAll('*'), dst=clone.querySelectorAll('*');
  const props=['fill','stroke','stroke-width','stroke-dasharray','opacity','fill-opacity','stroke-opacity','font-family','font-size','font-weight','display'];
  src.forEach((n,i)=>{ const cs=getComputedStyle(n); dst[i].setAttribute('style',props.map(p=>`${p}:${cs.getPropertyValue(p)}`).join(';')); });
  clone.querySelectorAll('.hov').forEach(n=>n.remove());
  const vb=sv.viewBox.baseVal, W2=vb.width, H2=vb.height+40, scale=2;
  const wrap=`<svg xmlns="http://www.w3.org/2000/svg" width="${W2}" height="${H2}" viewBox="0 -30 ${W2} ${H2}"><rect x="0" y="-30" width="${W2}" height="${H2}" fill="${col('panel')}"/><text x="4" y="-10" style="font:700 15px Barlow,sans-serif;fill:${col('ink')}">${document.getElementById('chartv-t').textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</text>${clone.innerHTML}</svg>`;

}

function goTo(d){
  if(!d) return;
  if(d.place){ closeResults(); S.view='overview'; select(null); fitTo(d); return; }
  if(d.region){ S.reg=true; syncChip('reg'); S.view='overview'; select(d.key); return; }
  if(d.sub){ S.infra=true; syncChip('infra'); }
  if(d.osm){ S.osm=true; syncChip('osm'); if(S.year!==2026){ S.year=2026; yr.value=2026; updYear(); } S.types.add(d.t); syncType(d.t); }
  if(!d.osm&&!d.sub){ if(d.t!=='grid'&&!S.types.has(d.t)){ S.types.add(d.t); syncType(d.t); } if(future(d)&&!S.future){ S.future=true; syncChip('future'); }
    if(d.off&&S.year>=d.off){ S.year=d.off-1; yr.value=S.year; updYear(); } }
  S.cmp=false; select(d.key);
}

/* ---------- search everything ---------- */
const sIn=document.getElementById('search'), sRes=document.getElementById('results');
const PLACES=Object.entries(P).filter(([k,v])=>v[3]).map(([k,v])=>({key:'place_'+k,place:1,k,c:[v[1],v[2]]}));
const PC_RE=/^[A-Z]{1,2}[0-9][A-Z0-9]?(\s*[0-9][A-Z]{2})?$/i;
let sItems=[], sIdx=-1;
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function closeResults(){ sRes.classList.remove('open'); sIn.setAttribute('aria-expanded','false'); sIdx=-1; }
function runSearch(){
  const q=norm(sIn.value.trim()); if(q.length<2){ closeResults(); return; }
  const score=n=>{ const s=norm(n); if(!s) return -1; if(s.startsWith(q)) return 3; if(s.split(/[\s(\-]+/).some(w=>w.startsWith(q))) return 2; return s.includes(q)?1:-1; };
  const out=[];
  if(PC_RE.test(sIn.value.trim())) out.push({kind:'pc',label:sIn.value.trim().toUpperCase(),sub:tr('s_pc_go'),sc:9});
  ALL.forEach(d=>{ const s=Math.max(score(nm(d)),score(d.n)); if(s>0) out.push({kind:'site',d,label:nm(d),sub:tr('t_'+d.t)+(d.mw?' · '+fmtMW(d.mw):''),sc:s+2}); });
  PLACES.forEach(p=>{ const s=score(pn(p.k)); if(s>0) out.push({kind:'place',d:p,label:pn(p.k),sub:tr('s_place'),sc:s+1.5}); });
  REG.forEach(r=>{ const s=Math.max(score(r[1]),score(r[2])); if(s>0) out.push({kind:'region',d:byId['reg'+r[0]],label:LANG==='cy'?r[2]:r[1],sub:tr('s_region'),sc:s+1}); });
  SUBOBJ.forEach(o=>{ if(!o.nen) return; const s=score(o.nen); if(s>0) out.push({kind:'sub',d:o,label:o.nen,sub:tr('sub_t')+' · '+o.kv+' kV',sc:s}); });
  OTHERS.forEach(o=>{ if(!o.nen&&!o.ncy) return; const s=Math.max(score(o.nen),score(o.ncy)); if(s>0) out.push({kind:'osm',d:o,label:nm(o),sub:tr('t_'+o.t)+(o.mw?' · '+fmtMW(o.mw):''),sc:s-.5}); });
  out.sort((a,b)=>b.sc-a.sc||a.label.localeCompare(b.label));
  sItems=out.slice(0,9); sIdx=sItems.length?0:-1;
  sRes.innerHTML = sItems.length ? sItems.map((it,i)=>{ const t=it.d&&it.d.t; const c=it.kind==='sub'?SUBCOL(it.d.kv):t?col(t==='grid'?'grid':t):'var(--muted)';
      const ic=it.kind==='place'||it.kind==='region'||it.kind==='pc'?'':icon(it.kind==='sub'?'grid':t);
      return `<li role="option" id="sr${i}" aria-selected="${i===sIdx}" data-i="${i}"><span class="ri" style="--c:${c}">${ic}</span>${it.label}<small>${it.sub}</small></li>`; }).join('')
    : `<li class="none">${tr('s_none')}</li>`;
  sRes.classList.add('open'); sIn.setAttribute('aria-expanded','true');
  sRes.querySelectorAll('li[data-i]').forEach(li=>li.onmousedown=e=>{ e.preventDefault(); pick(+li.dataset.i); });
}
function pick(i){ const it=sItems[i]; if(!it) return; closeResults(); sIn.blur(); if(isSheet()) setSheet('half');
  if(it.kind==='pc'){ S.view='overview'; S.tab='map'; select(null); if(isSheet()) setSheet('half'); checkPostcode(it.label); return; }
  goTo(it.kind==='place'?it.d:it.kind==='region'?it.d:it.d); sIn.value=''; }
sIn.addEventListener('input',runSearch);
sIn.addEventListener('focus',()=>{ if(isSheet()&&sheetState!=='full') setSheet('full'); if(sIn.value.trim().length>=2) runSearch(); });
sIn.addEventListener('blur',()=>{ setTimeout(closeResults,120); window.scrollTo(0,0); });
sIn.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!sItems.length) return; sIdx=(sIdx+(e.key==='ArrowDown'?1:-1)+sItems.length)%sItems.length;
    sRes.querySelectorAll('li[data-i]').forEach(li=>li.setAttribute('aria-selected',+li.dataset.i===sIdx)); sIn.setAttribute('aria-activedescendant','sr'+sIdx); }
  else if(e.key==='Enter'){ e.preventDefault(); if(sIdx>=0) pick(sIdx); } });

  if(liveNow()&&FUEL[d.t]&&(d.osm?d.mw:active(d))&&!d.ps){ const r=d.osm?null:realMW(d), mw=r!=null?r:(d.osm?d.mw*fleet(d.t):liveMW(d)); s+=`<em>${r!=null?tr('tip_real',{v:fmtLive(mw)}):tr('tip_now',{v:fmtLive(mw)})}</em>`; }
  return s;

function hideTip(){ tip.style.display='none'; }
if(canHover){
  gMarks.on('mouseover',e=>{ const g=e.target.closest('.mk'); if(!g) return; const d=d3.select(g).datum(); const r=node.getBoundingClientRect(); showTip(d,e.clientX-r.left,e.clientY-r.top); })
        .on('mouseout',e=>{ if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('.mk')) hideTip(); });
  gReg.on('mouseover',e=>{ const g=e.target.closest('.rg'); if(!g) return; const d=byId[d3.select(g).datum().key]; const [x,y]=d3.pointer(e,node); showTip(d,x,y); }).on('mouseout',hideTip);
  gLinks.on('mouseover',e=>{ const g=e.target.closest('.lk'); if(!g) return; const d=d3.select(g).datum(); const [x,y]=d3.pointer(e,node); showTip(d,x,y); }).on('mouseout',hideTip);
  let raf=0; svg.on('mousemove.tip',e=>{ if(e.target!==node) return; cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{ const [x,y]=d3.pointer(e,node); const h=dotQT&&dotQT.find(x,y,9);
    if(h){ showTip(h[2],x,y); node.style.cursor='pointer'; } else { hideTip(); node.style.cursor=''; } }); });
  svg.on('mouseleave.tip',hideTip);
}

new ResizeObserver(()=>{ placeSearch(); if(isSheet()) applySheet(sheetSizes()[sheetState]); else applySheet(0); if(node.clientWidth!==W||node.clientHeight!==H) setup(); }).observe(stage);
if(isSheet()) setSheet('half');
/* ---------- drag the side panel wider on a computer: everything inside grows with it ---------- */
(function(){
  const rz=document.getElementById('rz'), sheet=document.getElementById('sheet'), BASE=390, MIN=320;
  const maxW=()=>Math.max(BASE,Math.min(BASE*2.2,innerWidth*0.6,innerWidth-460));
  const cur=()=>sheet.getBoundingClientRect().width;
  const apply=(w,keep)=>{ w=Math.round(Math.max(MIN,Math.min(maxW(),w))); document.documentElement.style.setProperty('--sz',(w/BASE).toFixed(3));
    rz.setAttribute('aria-valuemin',MIN); rz.setAttribute('aria-valuemax',Math.round(maxW())); rz.setAttribute('aria-valuenow',w);
    if(keep){ try{ w===BASE?localStorage.removeItem('pm_sw'):localStorage.setItem('pm_sw',String(w)); }catch(e){ /* storage blocked: the width just isn't remembered */ } } };
  let rt=0; new ResizeObserver(()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(node.clientWidth!==W||node.clientHeight!==H) setup(); },90); }).observe(document.querySelector('.mapwrap'));   // the map redraws once the panel settles
  try{ const s=+localStorage.getItem('pm_sw'); if(s&&!isSheet()) apply(s); else apply(BASE); }catch(e){ apply(BASE); }
  addEventListener('resize',()=>{ if(!isSheet()) apply(cur()); });
  rz.addEventListener('pointerdown',e=>{ if(isSheet()) return; rz.setPointerCapture(e.pointerId); document.body.classList.add('rzing'); e.preventDefault(); });
  rz.addEventListener('pointermove',e=>{ if(rz.hasPointerCapture(e.pointerId)) apply(innerWidth-e.clientX); });
  const end=e=>{ if(!rz.hasPointerCapture(e.pointerId)) return; rz.releasePointerCapture(e.pointerId); document.body.classList.remove('rzing'); apply(cur(),true); };
  rz.addEventListener('pointerup',end); rz.addEventListener('pointercancel',end);
  rz.addEventListener('dblclick',()=>apply(BASE,true));
  rz.addEventListener('keydown',e=>{ const w=cur(); const k=e.key; if(k==='ArrowLeft') apply(w+30,true); else if(k==='ArrowRight') apply(w-30,true); else if(k==='Home') apply(BASE,true); else if(k==='End') apply(maxW(),true); else return; e.preventDefault(); });
})();
panel = (f => function(){ f(); syncHash(); })(panel);
document.getElementById('sharebtn').onclick=()=>{ gcEvent('share','Share this view'); shareView(); };
window.addEventListener('hashchange',()=>{ if(location.hash.replace(/^#/,'')!==stateHash()) applyHash(false); });
buildChrome(); setup(); if(!applyHash(true)) panel();
/* smaller generators and substations: loaded after the map has appeared */
function addSmall(pl,sb){
  if(pl&&!OTHERS.length){ pl.forEach((a,i)=>{ const o=osmObj(a,i); OTHERS.push(o); byId[o.key]=o; });
    OTHERS_BY_SIZE.length=0; OTHERS_BY_SIZE.push(...OTHERS.slice().sort((a,b)=>(b.mw||0)-(a.mw||0))); }
  if(sb&&!SUBOBJ.length) sb.forEach((s,i)=>{ const o=subObj(s,i); SUBOBJ.push(o); byId[o.key]=o; });
  render();
  if(S.pendingSel&&byId[S.pendingSel]){ const k=S.pendingSel; S.pendingSel=null; select(k); }
  else if(!S.sel&&(S.tab==='map'||S.view==='wales')) rerender();
}
if(OSMP===null||SUBS===null){
  const go=()=>Promise.all([OSMP===null?lazyJSON('plants'):null, SUBS===null?lazyJSON('subs'):null]).then(([a,b])=>addSmall(a,b));
  if(window.requestIdleCallback) requestIdleCallback(go,{timeout:1200}); else setTimeout(go,300);
}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>position());
try{ if(!localStorage.getItem('pm_intro')) setTimeout(showCoach,500); }catch(e){ setTimeout(showCoach,500); }
yr.addEventListener('input',()=>{ if(!document.getElementById('coach').hidden) hideCoach(); },{once:true});
refreshLive();
</script>
</body>
