<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UK power, source to socket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#cbdadf; --land:#e4e8e3; --land-uk:#fbfcfa; --coast:#98acb3;
  --ink:#1b282e; --muted:#5a6b71; --panel:#ffffff; --rule:#d6dee1; --soft:#eef2f3;
  --grid:#52636a; --hub:#1b282e; --pyl:#8d9ba0; --warn:#d6333a;
  --ow:#0f8b8d; --nw:#5b9a2e; --nu:#7a4fd1; --gas:#d2692a; --bio:#9a7b2c; --hy:#2f6fd0; --so:#d9a100; --ti:#0aa4c4; --bat:#607482; --ic:#c23b77;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sea:#0e1b21; --land:#1a252a; --land-uk:#2a383e; --coast:#41565e;
    --ink:#e6edef; --muted:#9fb1b7; --panel:#141f24; --rule:#2b3a40; --soft:#1c2a30;
    --grid:#9fb1b7; --hub:#e6edef; --pyl:#5d7078; --bat:#8fa3b0;
  }
}
:root[data-theme="dark"]{
  --sea:#0e1b21; --land:#1a252a; --land-uk:#2a383e; --coast:#41565e;
  --ink:#e6edef; --muted:#9fb1b7; --panel:#141f24; --rule:#2b3a40; --soft:#1c2a30;
  --grid:#9fb1b7; --hub:#e6edef; --pyl:#5d7078; --bat:#8fa3b0;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--panel);overflow:hidden;max-width:100vw}
.app{max-width:100vw;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
header{padding:10px 14px 8px;border-bottom:1px solid var(--rule);background:var(--panel)}
.titlerow{display:flex;align-items:center;gap:8px;justify-content:space-between}
h1{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:-.01em;margin:0;line-height:1.1;flex:1;min-width:0}
h1 span{font-weight:500;color:var(--muted)}
.tools{display:flex;gap:6px;align-items:center;flex:none}
select,.tbtn{font:inherit;font-size:.9rem;color:var(--ink);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:5px 8px;max-width:100%}
.tbtn{cursor:pointer;font-weight:600;white-space:nowrap}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
/* search */
.search{position:relative;flex:1;min-width:0;max-width:340px}
.search input{width:100%;font:inherit;font-size:.9rem;color:var(--ink);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:6px 9px 6px 28px}
.search svg.mag{position:absolute;left:8px;top:50%;width:14px;height:14px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;min-width:260px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);list-style:none;margin:0;padding:4px;z-index:30;max-height:60vh;overflow:auto;display:none}
.results.open{display:block}
.results li{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.9rem}
.results li[aria-selected="true"],.results li:hover{background:var(--soft)}
.results .ri{width:20px;height:20px;border-radius:50%;background:var(--c,var(--muted));display:grid;place-items:center;flex:none}
.results .ri svg{width:13px;height:13px;color:#fff}
.results small{margin-left:auto;color:var(--muted);font-size:.78rem;white-space:nowrap}
.results .none{color:var(--muted);cursor:default}
/* header buttons */
.tbtn svg{width:16px;height:16px;vertical-align:-3px}
.tbtn .lab{margin-left:5px}
/* overlays: layers, table, intro */
.pop{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:none}
.pop.open{display:block}
#layers{top:calc(env(safe-area-inset-top,0px) + 56px);right:14px;width:min(420px,calc(100vw - 20px));max-height:calc(100% - 80px);overflow:auto;padding:14px 16px}
#layers h4{margin:12px 0 6px;font-size:.8rem;text-transform:none;color:var(--muted);font-weight:600}
#layers h4:first-of-type{margin-top:0}
.pophead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pophead b{font-family:"Barlow Semi Condensed",sans-serif;font-size:1.15rem}
.xbtn{font:inherit;font-size:1.2rem;line-height:1;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 6px}
.linkbtn{font:inherit;font-size:.85rem;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;margin-top:12px}
.scrim{position:fixed;inset:0;background:rgba(10,20,25,.35);z-index:35;display:none}
.scrim.open{display:block}
#intro{left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 28px));padding:20px 22px}
#intro h2{font-family:"Barlow Semi Condensed",sans-serif;margin:0 0 10px;font-size:1.4rem}
#intro ol{margin:0 0 16px;padding-left:1.2em;line-height:1.5}
#intro li{margin:6px 0}
#tablev{inset:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:none;flex-direction:column;padding:14px 16px}
#tablev.open{display:flex}
.tcontrols{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tcontrols input[type=text]{flex:1;min-width:140px;font:inherit;padding:6px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--soft);color:var(--ink)}
.tcontrols label{font-size:.85rem;display:flex;gap:5px;align-items:center}
.twrap{flex:1;overflow:auto;border:1px solid var(--rule);border-radius:8px}
table.sites{border-collapse:collapse;width:100%;font-size:.88rem}
table.sites th{position:sticky;top:0;background:var(--soft);text-align:left;font-weight:600;padding:7px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;user-select:none}
table.sites th[aria-sort="ascending"]::after{content:" ▲";font-size:.7em}
table.sites th[aria-sort="descending"]::after{content:" ▼";font-size:.7em}
table.sites td{padding:6px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.sites td.num{text-align:right;font-variant-numeric:tabular-nums}
table.sites tbody tr{cursor:pointer}
table.sites tbody tr:hover{background:var(--soft)}
table.sites .ti{display:inline-flex;align-items:center;gap:6px}
table.sites .ti svg{width:14px;height:14px;color:var(--c)}
.tcount{font-size:.8rem;color:var(--muted);margin-top:6px}
/* hover tip */
.tip{position:absolute;z-index:20;pointer-events:none;background:var(--panel);border:1px solid var(--rule);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:7px 10px;font-size:.85rem;max-width:260px;display:none;line-height:1.35}
.tip b{display:block;font-size:.92rem}
.tip span{color:var(--muted);display:block}
.tip em{font-style:normal;font-weight:600;display:block;margin-top:2px}
/* credits */
.attrib{position:absolute;right:6px;bottom:calc(var(--sheet,0px) + 2px);font:500 .66rem "Barlow",sans-serif;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 6px;border-radius:4px;z-index:3;max-width:calc(100% - 12px);text-align:right}
.attrib a{color:inherit}
/* compare */
.cmprow{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.cmprow select{font:inherit;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--soft);color:var(--ink)}
.ctab{width:100%;border-collapse:collapse;font-size:.88rem;margin:8px 0}
.ctab th,.ctab td{padding:5px 4px;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctab th:first-child,.ctab td:first-child{text-align:left}
.ctab td:first-child{display:flex;gap:6px;align-items:center}
.ctab td svg{width:14px;height:14px;color:var(--c)}
.ctab .up{color:#2fa84f}.ctab .down{color:var(--warn)}
.ctab tfoot td{font-weight:600;border-bottom:0}
.mk.cmp-new .ring{display:block;stroke:#2fa84f;stroke-width:3}
.mk.cmp-gone .dot{fill:var(--muted)!important}
.mk.cmp-gone .ring{display:block;stroke:var(--warn);stroke-width:2.5;stroke-dasharray:3 2}
/* bottom sheet (phones and small tablets) */
.sheet{display:flex;flex-direction:column;min-height:0}
.grab{display:none}
.chip{flex:none;font:inherit;font-size:.85rem;font-weight:500;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:4px 10px 4px 5px;display:flex;align-items:center;gap:6px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);display:block;margin-left:3px}
.chip .ib{width:18px;height:18px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none}
.chip .ib svg{width:12px;height:12px;color:#fff}
.chip.livechip i{background:var(--ic);box-shadow:0 0 0 3px color-mix(in srgb,var(--ic) 30%,transparent)}
.chip.ring i{background:transparent;border:1.5px dashed var(--ink)}
.chip.line i{height:0;border-radius:0;width:14px;border-top:2px dashed var(--grid);background:none}
.chip.pyl i{height:0;border-radius:0;width:14px;border-top:2px solid var(--pyl);background:none}
.chip.dots i{background:radial-gradient(circle,var(--muted) 30%,transparent 32%) 0 0/5px 5px;border-radius:2px}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.chip:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,.mk:focus-visible{outline:2px solid var(--ic);outline-offset:2px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column}
.mapwrap{position:relative;flex:1;min-height:0;background:var(--sea)}
#base,#dots,#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#dots{pointer-events:none}
#map{touch-action:none;cursor:grab;background:transparent}
.moving .lbl{display:none}
.moving .lf,.moving .flow{animation-play-state:paused}
.moving .lf,.moving .link,.moving .flow,.moving .flowbase{vector-effect:non-scaling-stroke}
.lf.still{animation:none;stroke-dasharray:none;opacity:.45}
.mk.compact .ico{display:none}
#map:active{cursor:grabbing}
.land path{fill:var(--land);stroke:var(--coast);stroke-width:.6;vector-effect:non-scaling-stroke}
.land path.uk{fill:var(--land-uk)}
.pyl path{fill:none;stroke:var(--pyl);vector-effect:non-scaling-stroke;stroke-linejoin:round}
.pyl path.v400{stroke-width:1.1}
.pyl path.v275{stroke-width:.7;stroke-dasharray:none;opacity:.8}
.pyl path.vdc{stroke-width:.8;stroke-dasharray:3 3;opacity:.7}
.pyl path.v220{stroke-width:.6;opacity:.7}
.warea path{fill:#cfe6e2;stroke:#8fbdb5;stroke-width:.6;vector-effect:non-scaling-stroke;display:none}
.infra .warea path{display:block}
.infra .pyl path.v400{stroke:#4f5bd5;stroke-width:1.5;opacity:1}
.infra .pyl path.v275{stroke:#d9453b;stroke-width:1.2;opacity:1}
.infra .pyl path.v220{stroke:#39a7d8;stroke-width:1.1;opacity:1}
.infra .pyl path.vdc{stroke:#b0407a;stroke-width:1.3;stroke-dasharray:5 4;opacity:1}
.ilegend{position:absolute;right:54px;top:10px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font:500 .78rem "Barlow",sans-serif;color:var(--ink);display:none;line-height:1.7}
.infra-on .ilegend{display:block}
.ilegend b{display:block;font-weight:600;margin-top:2px}
.ilegend i{display:inline-block;width:18px;vertical-align:middle;margin-right:6px}
.ilegend i.l{border-top:2px solid}.ilegend i.d{border-top:2px dashed #b0407a}
.ilegend i.s{width:8px;height:8px;margin:0 11px 0 5px}
.ilegend i.a{width:14px;height:10px;background:#cfe6e2;border:1px solid #8fbdb5;margin-right:10px}
@media (max-width:599px){.ilegend{top:auto;bottom:calc(var(--sheet,0px) + 82px);right:10px}}
.regdot{stroke:var(--panel);stroke-width:2}
.rega path{fill-opacity:.38;stroke:var(--panel);stroke-width:1.2;vector-effect:non-scaling-stroke}
.regtxt{font:700 11px "Barlow Semi Condensed",sans-serif;fill:#fff;pointer-events:none;text-anchor:middle}
.srcs{list-style:none;padding:0;margin:4px 0;font-size:.85rem}
.srcs li{padding:3px 0;border-bottom:1px solid var(--rule);line-height:1.4}
.srcs a{color:var(--ink)}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;margin-left:6px;vertical-align:1px}
.badge.ok{color:#2fa84f}.badge.chk{color:#c77700}.badge.none{color:var(--muted)}
.hbar{display:grid;grid-template-columns:8.5em 1fr auto;gap:4px 8px;align-items:center;font-size:.85rem;margin:6px 0}
.hbar .b{height:12px;border-radius:2px;background:var(--c,var(--ink))}
.hbar b{font-variant-numeric:tabular-nums;font-weight:600}
.story{border-top:1px solid var(--rule);padding-top:10px;margin-top:14px}
.story h3{margin-top:0;font-size:1.05rem}
.ctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.ctl button{width:34px;height:34px;border-radius:6px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);font:600 1.1rem "Barlow",sans-serif;cursor:pointer;display:grid;place-items:center}
.pills{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 64px)}
.cipill{background:var(--panel);border:1px solid var(--rule);border-left:5px solid var(--cic,var(--muted));border-radius:999px;padding:3px 10px 3px 8px;font:500 .8rem "Barlow",sans-serif;color:var(--ink);cursor:pointer;display:flex;gap:5px;align-items:baseline}
.cipill b{font:700 1rem "Barlow Semi Condensed",sans-serif}
.status{background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:4px 10px 4px 8px;font:500 .8rem "Barlow",sans-serif;color:var(--ink);display:flex;gap:6px;align-items:center;cursor:pointer;max-width:100%}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status.live i{background:#2fa84f;box-shadow:0 0 0 3px color-mix(in srgb,#2fa84f 30%,transparent)}
.status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yearbar{position:absolute;left:10px;right:54px;bottom:calc(var(--sheet,0px) + 18px);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:6px 12px 8px;display:flex;align-items:center;gap:12px;max-width:460px}
.yearbar label{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:1.25rem;min-width:4.6em;line-height:1}
.yearbar label small{display:block;font:500 .72rem "Barlow",sans-serif;color:var(--muted)}
input[type=range]{flex:1;accent-color:var(--ink);min-width:0}
.panel{background:var(--panel);border-top:1px solid var(--rule);overflow-y:auto;max-height:44%;padding:14px 16px 18px;flex:none}
.panel h2{font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;font-size:1.35rem;margin:0;line-height:1.15}
.panel p{margin:.5em 0;line-height:1.5;max-width:62ch}
.meta{color:var(--muted);font-size:.9rem;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;color:var(--c)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:12px 0}
.stats div{background:var(--panel);padding:8px 10px}
.stats b{display:block;font-family:"Barlow Semi Condensed",sans-serif;font-size:1.2rem;font-weight:700;line-height:1.1}
.stats span{font-size:.78rem;color:var(--muted)}
.route{list-style:none;margin:8px 0 4px;padding:0}
.route li{position:relative;padding:0 0 12px 22px;line-height:1.35}
.route li::before{content:"";position:absolute;left:4px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink))}
.route li:not(:last-child)::after{content:"";position:absolute;left:7.5px;top:14px;bottom:0;width:1px;background:var(--rule)}
.route li.sur{color:var(--muted)}
.route li.sur::before{background:transparent;border:1.5px dashed var(--muted)}
.route small{display:block;color:var(--muted);font-size:.82rem}
h3{font-size:.95rem;font-weight:600;margin:16px 0 4px}
.back{display:block;font:inherit;font-size:.9rem;color:var(--muted);background:none;border:0;padding:0;margin-bottom:8px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.bar{display:flex;height:14px;border-radius:3px;overflow:hidden;margin:10px 0 8px;background:var(--soft)}
.bar div{height:100%}
.legend{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:.9rem;max-width:380px}
.legend span{display:flex;align-items:center;gap:7px}
.legend svg{width:14px;height:14px;color:var(--c);flex:none}
.legend b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.fine{font-size:.8rem;color:var(--muted);line-height:1.45;margin-top:14px}
.chg{font-size:.9rem;padding-left:1.1em}
.chg li{margin:2px 0}
.livebox{border:1px solid var(--rule);border-left:4px solid var(--c,var(--ic));border-radius:6px;padding:8px 12px;margin:10px 0}
.livebox b{font-family:"Barlow Semi Condensed",sans-serif;font-size:1.2rem}
.livebox span{display:block;font-size:.85rem;color:var(--muted)}
.livebox.warn{--c:var(--warn)}
.livebox.warn b{color:var(--warn)}
.hicon{width:26px;height:26px;border-radius:50%;background:var(--c);display:inline-grid;place-items:center;vertical-align:-6px;margin-right:6px}
.hicon svg{width:16px;height:16px;color:#fff}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row input[type=text]{flex:1;min-width:0;font:inherit;font-size:.95rem;padding:6px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--soft);color:var(--ink);text-transform:uppercase}
.row button,.pbtn{font:inherit;font-size:.9rem;font-weight:600;padding:6px 12px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--panel);cursor:pointer}
.pbtn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.sitelist{list-style:none;padding:0;margin:6px 0;font-size:.92rem}
.sitelist li{border-bottom:1px solid var(--rule)}
.sitelist button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;width:100%;padding:6px 0}
.sitelist button:focus-visible{outline:2px solid var(--ic)}
.sitelist svg{width:14px;height:14px;color:var(--c);flex:none}
.sitelist b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.feeds{list-style:none;padding:0;margin:6px 0;font-size:.85rem}
.feeds li{display:flex;gap:8px;padding:2px 0;color:var(--muted)}
.feeds li b{color:var(--ink);font-weight:600}
.ok{color:#2fa84f}.bad{color:var(--warn)}
.tabs{display:flex;gap:4px;margin:-4px 0 14px;border-bottom:1px solid var(--rule)}
.tabs button{font:inherit;font-weight:600;font-size:.95rem;background:none;border:0;border-bottom:3px solid transparent;padding:6px 10px;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.cibig{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:10px 0}
.cibig div{background:var(--panel);padding:10px}
.cibig b{display:block;font:700 1.9rem/1 "Barlow Semi Condensed",sans-serif}
.cibig small{display:block;font-size:.75rem;color:var(--muted);margin-top:2px}
.cibig span{display:block;font-size:.82rem;font-weight:600;margin-top:6px}
.chart{width:100%;margin:6px 0 2px}
.chart svg{display:block;width:100%;overflow:visible}
.chart .ax text{font:500 10.5px "Barlow",sans-serif;fill:var(--muted)}
.chart .ax line,.chart .ax path{stroke:var(--rule)}
.chart .act{fill:none;stroke:var(--ink);stroke-width:2}
.chart .fc{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:4 3;opacity:.7}
.chart .area{fill:var(--soft)}
.chart .nowl{stroke:var(--warn);stroke-width:1.5}
.chart .nowt{font:600 10.5px "Barlow",sans-serif;fill:var(--warn)}

function fitPts(ll, kmax=7){

  const dx=Math.max(x[1]-x[0],40), dy=Math.max(y[1]-y[0],40);
  const k=Math.max(1,Math.min(kmax,.62*Math.min(W/dx,(vh-100)/dy)));
  const cx=(x[0]+x[1])/2, cy=(y[0]+y[1])/2;
  const t=d3.zoomIdentity.translate(W/2-k*cx,(vh-40)/2-k*cy).scale(k);
  svg.transition().duration(matchMedia('(prefers-reduced-motion: reduce)').matches?0:650).call(zoom.transform,t);
}

function drawPrice(el){
  const PR=LIVE.price, C=LIVE.ci.series.filter(d=>d.a!=null);
  const w=el.clientWidth||320, h=160, m={l:30,r:38,t:10,b:20};
  const t0=Math.max(d3.min(PR,d=>d.t),Date.now()-86400000), t1=Date.now();
  const x=d3.scaleTime().domain([t0,t1]).range([m.l,w-m.r]);
  const yc=d3.scaleLinear().domain([0,(d3.max(C,d=>d.a)||200)*1.1]).nice().range([h-m.b,m.t]);
  const yp=d3.scaleLinear().domain([Math.min(0,d3.min(PR,d=>d.p)),(d3.max(PR,d=>d.p)||100)*1.1]).nice().range([h-m.b,m.t]);
  const s=d3.select(el).append('svg').attr('viewBox',`0 0 ${w} ${h}`).attr('height',h);
  s.append('g').attr('class','ax').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(x).ticks(4).tickFormat(d=>{const p=ukParts(d);return p.hh+':'+p.mm;}).tickSizeOuter(0));
  s.append('g').attr('class','ax').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(yc).ticks(4)).call(g=>g.select('.domain').remove());
  s.append('g').attr('class','ax').attr('transform',`translate(${w-m.r},0)`).call(d3.axisRight(yp).ticks(4).tickFormat(v=>'£'+v)).call(g=>g.select('.domain').remove());
  const inR=d=>d.t>=t0&&d.t<=t1;
  s.append('path').attr('class','act').attr('d',d3.line().x(d=>x(d.t)).y(d=>yc(d.a)).curve(d3.curveMonotoneX)(C.filter(inR)));
  s.append('path').attr('class','proj').attr('d',d3.line().x(d=>x(d.t)).y(d=>yp(d.p)).curve(d3.curveMonotoneX)(PR.filter(inR)));
}
function comparePanel(){

function drawShort(el){

const CI='https://api.carbonintensity.org.uk', ELX='https://data.elexon.co.uk/bmrs/api/v1';
async function getJSON(url,ms=9000){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{ const r=await fetch(url,{signal:c.signal,headers:{Accept:'application/json'}}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); } finally{ clearTimeout(t); } }
const arr = x => Array.isArray(x)?x:(x&&Array.isArray(x.data)?x.data:[]);
const mixObj = gm => { const m={}; (gm||[]).forEach(f=>m[f.fuel]=+f.perc||0); return m; };
function ukNow(){ const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g=k=>f.find(p=>p.type===k).value; const hh=+g('hour')%24, mm=+g('minute');
  return {date:`${g('year')}-${g('month')}-${g('day')}`, sp:Math.floor((hh*60+mm)/30)+1}; }
const bmuId = r => String(r.nationalGridBmUnit||r.bmUnit||r.bmUnitId||'').replace(/^[TE]_/,'').toUpperCase();
function levelAt(recs, now){ // recs for one BMU: pick the segment covering now, else latest
  let best=null;
  for(const r of recs){ const a=Date.parse(r.timeFrom), b=Date.parse(r.timeTo); const lf=+r.levelFrom, lt=+r.levelTo;
    if(!isNaN(a)&&!isNaN(b)&&a<=now&&now<=b) return b>a? lf+(lt-lf)*(now-a)/(b-a) : lt;
    if(!best||Date.parse(r.timeTo)>Date.parse(best.timeTo)) best=r; }
  return best? +best.levelTo : null;
}
function bySite(levels){ const out={};
  for(const s of SITES){ if(!s.bmu) continue; let sum=0,n=0;
    for(const id in levels){ if(s.bmu.some(p=>id.startsWith(p))){ sum+=levels[id]; n++; } }
    if(n) out[s.id]=sum; }
  return out; }
async function refreshLive(){

    ci_day: async()=>{ const x=await getJSON(CI+'/intensity/date'); const s=arr(x).map(d=>({t:Date.parse(d.from),f:d.intensity&&d.intensity.forecast,a:d.intensity&&d.intensity.actual})).filter(d=>!isNaN(d.t)); if(!s.length) throw new Error('empty'); LIVE.ci.day=s; if(!LIVE.ci.live) LIVE.ci.series=s; },
    ci_48: async()=>{ const iso=new Date(now).toISOString().slice(0,16)+'Z';
      const [b,f]=await Promise.all([getJSON(CI+'/intensity/'+iso+'/pt24h'),getJSON(CI+'/intensity/'+iso+'/fw48h')]);
      const m=new Map(); [...arr(b),...arr(f)].forEach(d=>{ const t=Date.parse(d.from); if(!isNaN(t)) m.set(t,{t,f:d.intensity&&d.intensity.forecast,a:d.intensity&&d.intensity.actual}); });
      const s=[...m.values()].sort((a,b)=>a.t-b.t); if(s.length<10) throw new Error('short'); LIVE.ci.series=s; LIVE.ci.live=true; },
    ci_reg: async()=>{ const x=await getJSON(CI+'/regional'); const d=arr(x)[0]; const v={}; (d.regions||[]).forEach(r=>{ if(r.regionid<=14&&r.intensity) v[r.regionid]=r.intensity.forecast; }); if(!Object.keys(v).length) throw new Error('empty'); LIVE.reg={from:d.from,v}; },
    ci_fac: async()=>{ const x=await getJSON(CI+'/intensity/factors'); const f=arr(x)[0]||{}; if(f['French Imports']!=null) IMPORT_CI['France']=f['French Imports']; if(f['Dutch Imports']!=null) IMPORT_CI['the Netherlands']=f['Dutch Imports']; if(f['Irish Imports']!=null){ IMPORT_CI['Ireland']=f['Irish Imports']; IMPORT_CI['Northern Ireland']=f['Irish Imports']; } },
    elx_mid: async()=>{ const iso=ms=>new Date(ms).toISOString().slice(0,19)+'Z';
      const x=await getJSON(`${ELX}/balancing/pricing/market-index?from=${iso(now-86400000)}&to=${iso(now)}&dataProviders=APXMIDP`,15000);
      const p=arr(x).map(r=>({t:Date.parse(r.startTime||r.timeFrom||r.settlementDate),p:+r.price,v:+(r.volume??1)})).filter(r=>!isNaN(r.t)&&!isNaN(r.p)&&r.v>0).sort((a,b)=>a.t-b.t);
      if(p.length<4) throw new Error('empty'); LIVE.price=p; },
    ci_nat: async()=>{ const x=await getJSON(CI+'/generation'); const d=Array.isArray(x.data)?x.data[0]:x.data; LIVE.nat={from:d.from,mix:mixObj(d.generationmix)}; },
    ci_wales: async()=>{ const x=await getJSON(CI+'/regional/wales'); const r=arr(x)[0]; const d=(r.data||[])[0]||r; LIVE.wales={from:d.from,mix:mixObj(d.generationmix),ci:d.intensity&&d.intensity.forecast,idx:d.intensity&&d.intensity.index}; },
    ci_hist: async()=>{ const iso=new Date(now).toISOString().slice(0,16)+'Z'; const x=await getJSON(CI+'/generation/'+iso+'/pt24h'); const h=arr(x).filter(d=>d&&d.generationmix).map(d=>({from:d.from,mix:mixObj(d.generationmix)})); h.sort((a,b)=>a.from<b.from?-1:1); if(h.length>2) LIVE.hist=h; else throw new Error('empty'); },
    elx_cur: async()=>{ const x=await getJSON(ELX+'/generation/outturn/current'); const ic={}; let tot=0;
      arr(x).forEach(r=>{ const ft=String(r.fuelType||r.fuel||'').toUpperCase(); const v=+(r.currentUsage??r.generation??r.currentMw??NaN); if(isNaN(v)) return; tot+=Math.max(0,v); if(ICCODE[ft]) ic[ICCODE[ft]]=v; });
      if(!Object.keys(ic).length) throw new Error('no interconnectors'); LIVE.ic=ic; if(tot>10000) LIVE.demandGW=Math.min(50,tot/1000*1.12); },
    elx_pn: async()=>{ const x=await getJSON(`${ELX}/balancing/physical/all?dataset=PN&settlementDate=${date}&settlementPeriod=${sp}`,15000);
      const g={}; arr(x).forEach(r=>{ const id=bmuId(r); if(id) (g[id]=g[id]||[]).push(r); });
      const lv={}; for(const id in g){ const v=levelAt(g[id],now); if(v!=null&&!isNaN(v)) lv[id]=v; }
      const s=bySite(lv); if(!Object.keys(s).length) throw new Error('no matches'); LIVE.bmu=s; LIVE._pnLevels=lv; },
    elx_boa: async()=>{ if(!LIVE._pnLevels) throw new Error('needs PN');
      const x=await getJSON(`${ELX}/balancing/acceptances/all?settlementDate=${date}&settlementPeriod=${sp}`,15000);
      const g={}; arr(x).forEach(r=>{ const id=bmuId(r); if(id) (g[id]=g[id]||[]).push(r); });
      const cut={}; for(const id in g){ const pn=LIVE._pnLevels[id]; if(pn==null) continue; const acc=levelAt(g[id],now); if(acc!=null&&pn-acc>0) cut[id]=pn-acc; }
      const bs=bySite(cut); const out={}; for(const k in bs){ const s=SITES.find(x=>x.id===k); if(s&&(s.t==='ow'||s.t==='nw')) out[k]=bs[k]; } LIVE.curt=out; }
  };
  // run in order so balancing can use PN levels
  for(const [k,fn] of Object.entries(tasks)){ try{ await fn(); LIVE.feeds[k]=true; any=true; }catch(e){ LIVE.feeds[k]=false; } }
  if(any){ LIVE.mode='live'; LIVE.updated=new Date().toISOString(); }
  statusPill(); if(!S.playing){ render(); panel(); }
  if(any && !refreshLive.timer) refreshLive.timer=setInterval(refreshLive,5*60*1000);
}
async function checkPostcode(q){
  q=(q||'').trim().toUpperCase(); if(!q) return;
  S.pc={q};

    let lat,lon,outcode;

    catch(e){ const oc=q.replace(/\s+/g,' ').split(' ')[0]; const r=await getJSON('https://api.postcodes.io/outcodes/'+encodeURIComponent(oc)); lat=r.result.latitude; lon=r.result.longitude; outcode=r.result.outcode; }
    S.pc.c=[lat,lon]; S.pc.label=q;
    S.pc.near=SITES.filter(d=>active(d)&&S.types.has(d.t)).map(d=>({d,km:hav([lat,lon],d.c)})).sort((a,b)=>a.km-b.km).slice(0,3);
    try{ const x=await getJSON(CI+'/regional/postcode/'+encodeURIComponent(outcode)); const r=arr(x)[0]; const d=(r.data||[])[0]||r; S.pc.region=r.shortname||outcode; S.pc.ci=d.intensity&&d.intensity.forecast; S.pc.idx=d.intensity&&d.intensity.index; }catch(e){}
    try{ const iso=new Date().toISOString().slice(0,16)+'Z'; const x=await getJSON(CI+'/regional/intensity/'+iso+'/fw24h/postcode/'+encodeURIComponent(outcode)); const r=Array.isArray(x.data)?x.data[0]:x.data; const ps=(r&&r.data)||[];
      let best=null; for(let i=0;i+3<ps.length;i++){ const g=(ps[i].intensity.forecast+ps[i+1].intensity.forecast+ps[i+2].intensity.forecast+ps[i+3].intensity.forecast)/4; if(!best||g<best.g) best={g:Math.round(g),from:ps[i].from}; }
      if(best) S.pc.best={g:best.g,t:fmtWhen(best.from)}; }catch(e){}
    render(); panel(); fitPts([S.pc.c,...S.pc.near.map(s=>s.d.c)],6);
  }catch(e){

  }

    const on = cls==='type'? S.types.has(k) : S[k]; b.setAttribute('aria-pressed',on);
    if(cls==='type'){ b.style.setProperty('--c',col(k)); b.innerHTML=`<span class="ib">${icon(k)}</span>${tr(lab)}`; } else b.innerHTML=`<i></i>${tr(lab)}`;
    b.onclick=()=>{ if(cls==='type'){ S.types.has(k)?S.types.delete(k):S.types.add(k); b.setAttribute('aria-pressed',S.types.has(k)); } else { S[k]=!S[k]; b.setAttribute('aria-pressed',S[k]); } render(); panel(); };
    groups[grpn].appendChild(b);
  });
  document.getElementById('ilegend').innerHTML=`<b>${tr('lg_subs')}</b><div><i class="s" style="background:#4f5bd5"></i>400 kV</div><div><i class="s" style="background:#d9453b;border-radius:50%"></i>275 kV</div><div><i class="s" style="background:#39a7d8;border-radius:50%"></i>220 kV</div><b>${tr('lg_lines')}</b><div><i class="l" style="border-color:#4f5bd5"></i>400 kV</div><div><i class="l" style="border-color:#d9453b"></i>275 kV</div><div><i class="l" style="border-color:#39a7d8"></i>220 kV</div><div><i class="d"></i>HVDC</div><div><i class="a"></i>${tr('lg_wind')}</div>`;
  jump.innerHTML=`<option value="">${tr('find')}</option>`;
  [...Object.keys(T),'grid'].forEach(t=>{
    const items=ALL.filter(d=>d.t===t); if(!items.length) return;
    const og=document.createElement('optgroup'); og.label=tr('t_'+t);
    items.sort((a,b)=>nm(a).localeCompare(nm(b))).forEach(d=>{const o=document.createElement('option');o.value=d.key;o.textContent=nm(d);og.appendChild(o);});
    jump.appendChild(og);
  });
  jump.value=S.sel&&!byId[S.sel].osm?S.sel:'';
  document.getElementById('ys').textContent=S.year===2026?tr('today'):tr('projected');
  statusPill();
}
jump.onchange=()=>{ const v=jump.value, d=byId[v]; if(!d) return select(null);
  if(d.t!=='grid'&&!S.types.has(d.t)) S.types.add(d.t);
  if(future(d)) S.future=true;
  if(d.off&&S.year>=d.off){S.year=d.off-1;yr.value=S.year;updYear();}
  buildChrome(); select(v); };
function updYear(){ document.getElementById('yv').textContent=S.year; document.getElementById('ys').textContent=S.year===2026?tr('today'):tr('projected'); }
yr.oninput=()=>{ S.year=+yr.value; updYear(); if(S.sel){const d=byId[S.sel]; if(d.osm||d.sub||(d.off&&S.year>=d.off)) S.sel=null;} render(); panel(); };
document.getElementById('langbtn').onclick=()=>{ LANG=LANG==='cy'?'en':'cy'; try{localStorage.setItem('lang',LANG);}catch(e){} buildChrome(); render(); panel(); };
document.getElementById('walesbtn').onclick=()=>{
  if(S.view==='wales'){ S.view='overview'; select(null); svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity); return; }
  S.view='wales'; S.sel=null; render(); panel(); document.getElementById('walesbtn').setAttribute('aria-pressed','true');
  fitPts([[51.35,-5.3],[53.45,-2.7]],9); };
document.getElementById('cipill').onclick=()=>{ S.view='overview'; S.tab='carbon'; select(null); loadYTD(); $p.scrollTop=0; };
document.getElementById('status').onclick=()=>{ S.tab='map'; select(null); setTimeout(()=>{ const f=$p.querySelector('.feeds'); if(f) f.scrollIntoView({behavior:'smooth',block:'center'}); },50); };
document.getElementById('zin').onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1.6);
document.getElementById('zout').onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.6);
document.getElementById('zreset').onclick=()=>{S.view='overview';S.pc=null;select(null);svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity);};
/* ---------- bottom sheet (narrow screens) ---------- */
const sheet=document.getElementById('sheet'), grab=document.getElementById('grab'), mapwrap=document.querySelector('.mapwrap'), stage=document.querySelector('.stage');
let sheetState='half';
const isSheet = () => matchMedia('(max-width: 899px)').matches;
const sheetSizes = () => { const h=stage.clientHeight; return {peek:Math.min(150,h*.3), half:Math.round(h*.44), full:h-8}; };
const sheetPx = () => isSheet() ? sheet.getBoundingClientRect().height : 0;
function visH(){ return isSheet() ? Math.max(200, H - sheetSizes()[sheetState]) : H; }
function applySheet(px){ if(!isSheet()){ sheet.style.removeProperty('height'); mapwrap.style.setProperty('--sheet','0px'); stage.style.removeProperty('--sheet'); return; }
  stage.style.setProperty('--sheet',px+'px'); mapwrap.style.setProperty('--sheet',px+'px'); sheet.style.height=px+'px'; }
function setSheet(s){ sheetState=s; applySheet(sheetSizes()[s]); }
(function(){ let y0=0,h0=0,t0=0,drag=false;
  grab.addEventListener('pointerdown',e=>{ if(!isSheet()) return; drag=true; y0=e.clientY; h0=sheet.getBoundingClientRect().height; t0=performance.now(); sheet.classList.add('dragging'); grab.setPointerCapture(e.pointerId); });
  grab.addEventListener('pointermove',e=>{ if(!drag) return; const s=sheetSizes(); applySheet(Math.max(s.peek*.7,Math.min(s.full,h0-(e.clientY-y0)))); });
  const end=e=>{ if(!drag) return; drag=false; sheet.classList.remove('dragging');
    const s=sheetSizes(), h=sheet.getBoundingClientRect().height, dy=e.clientY-y0, v=dy/Math.max(1,performance.now()-t0);
    if(Math.abs(dy)<6){ setSheet(sheetState==='peek'?'half':sheetState==='half'?'full':'peek'); return; }
    let st = v<-.5 ? (sheetState==='peek'?'half':'full') : v>.5 ? (sheetState==='full'?'half':'peek') : Object.entries(s).sort((a,b)=>Math.abs(a[1]-h)-Math.abs(b[1]-h))[0][0];
    setSheet(st); };
  grab.addEventListener('pointerup',end); grab.addEventListener('pointercancel',end);
  grab.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setSheet(sheetState==='peek'?'half':sheetState==='half'?'full':'peek'); } });
})();

/* ---------- pop-overs: layers, table, intro ---------- */
const scrim=document.getElementById('scrim');
function openPop(id){ document.querySelectorAll('.pop.open').forEach(p=>p.classList.remove('open')); const p=document.getElementById(id); p.classList.add('open');
  scrim.classList.toggle('open', id!=='layers' || isSheet()); document.getElementById('layersbtn').setAttribute('aria-expanded',id==='layers');
  const f=p.querySelector('input,button:not(.xbtn),select'); if(f) setTimeout(()=>f.focus(),30); }
function closePops(){ document.querySelectorAll('.pop.open').forEach(p=>p.classList.remove('open')); scrim.classList.remove('open'); document.getElementById('layersbtn').setAttribute('aria-expanded','false'); }
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closePops);
scrim.onclick=closePops;
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closePops(); closeResults(); } });
document.addEventListener('pointerdown',e=>{ const l=document.getElementById('layers'); if(l.classList.contains('open')&&!l.contains(e.target)&&!e.target.closest('#layersbtn')&&!isSheet()) closePops(); });
document.getElementById('layersbtn').onclick=()=>{ document.getElementById('layers').classList.contains('open')?closePops():openPop('layers'); };
document.getElementById('tipsagain').onclick=()=>{ closePops(); showIntro(); };
function showIntro(){ document.getElementById('intro-t').textContent=tr('in_t');
  document.getElementById('intro-l').innerHTML=['in_1','in_2','in_3'].map(k=>`<li>${tr(k)}</li>`).join('');
  const ok=document.getElementById('intro-ok'); ok.textContent=tr('in_ok'); ok.onclick=()=>{ try{localStorage.setItem('pm_intro','1');}catch(e){} closePops(); };
  openPop('intro'); }

/* ---------- table view ---------- */
const TS={key:'mw',dir:-1};
function statusAt(d){ if(d.osm) return tr('st_op'); if(d.off&&S.year>=d.off) return tr('st_closed'); if(active(d)) return tr('st_op'); return d.st==='con'?tr('st_con'):tr('st_dev'); }
function openTable(){
  document.getElementById('tablev-t').textContent=tr('t_title');
  const f=document.getElementById('tfilter'); f.placeholder=tr('t_filter');
  const ty=document.getElementById('ttype'); const cur=ty.value;
  ty.innerHTML=`<option value="">${tr('t_all')}</option>`+Object.keys(T).map(t=>`<option value="${t}">${tr('t_'+t)}</option>`).join(''); ty.value=cur;
  document.getElementById('tosm-l').textContent=tr('t_osm');
  const cols=[['name','c_name'],['type','c_type'],['mw','c_cap'],['status','c_status'],['on','c_on'],['off','c_off'],['w','c_wales']];
  if(liveNow()) cols.push(['now','c_now']);
  document.querySelector('#ttable thead').innerHTML='<tr>'+cols.map(([k,l])=>`<th data-k="${k}" aria-sort="${TS.key===k?(TS.dir>0?'ascending':'descending'):'none'}" tabindex="0">${tr(l)}</th>`).join('')+'</tr>';
  document.querySelectorAll('#ttable th').forEach(th=>{ const go=()=>{ const k=th.dataset.k; TS.dir = TS.key===k ? -TS.dir : (k==='name'||k==='type'||k==='status'?1:-1); TS.key=k; openTable(); };
    th.onclick=go; th.onkeydown=e=>{ if(e.key==='Enter') go(); }; });
  drawTable(cols); if(!document.getElementById('tablev').classList.contains('open')) openPop('tablev');
}
function drawTable(cols){
  const q=document.getElementById('tfilter').value.trim().toLowerCase(), ty=document.getElementById('ttype').value, inc=document.getElementById('tosm').checked;
  let rows=[...SITES,...LINKS,...(inc?OTHERS:[])].filter(d=>(!ty||d.t===ty)&&(!q||nm(d).toLowerCase().includes(q)));
  const val=d=>({name:nm(d),type:tr('t_'+d.t),mw:d.mw||0,status:statusAt(d),on:d.osm?0:d.on,off:d.off||0,w:d.w?1:0,now:(liveNow()&&FUEL[d.t]&&(d.osm||active(d)))?Math.round(d.osm?(d.mw||0)*fleet(d.t):liveMW(d)):-1});
  rows=rows.map(d=>[d,val(d)]).sort((a,b)=>{ const x=a[1][TS.key], y=b[1][TS.key]; return (typeof x==='string'?x.localeCompare(y):x-y)*TS.dir; });
  const shown=rows.slice(0,600);
  document.querySelector('#ttable tbody').innerHTML=shown.map(([d,v])=>`<tr data-k="${d.key}" tabindex="0"><td>${v.name}</td><td><span class="ti" style="--c:${col(d.t)}">${icon(d.t)}${v.type}</span></td><td class="num">${d.mw?Math.round(d.mw).toLocaleString('en-GB'):'–'}</td><td>${v.status}</td><td class="num">${v.on||'–'}</td><td class="num">${v.off||'–'}</td><td>${v.w?tr('yes'):''}</td>${cols.length>7?`<td class="num">${v.now>=0?v.now.toLocaleString('en-GB'):'–'}</td>`:''}</tr>`).join('');
  document.getElementById('tcount').textContent=tr('t_count',{n:rows.length.toLocaleString('en-GB')})+(rows.length>shown.length?' · 600 shown':'');
  document.querySelectorAll('#ttable tbody tr').forEach(tr_=>{ const go=()=>{ closePops(); goTo(byId[tr_.dataset.k]); }; tr_.onclick=go; tr_.onkeydown=e=>{ if(e.key==='Enter') go(); }; });
}
['tfilter','ttype','tosm'].forEach(id=>document.getElementById(id).addEventListener(id==='tfilter'?'input':'change',()=>openTable()));
document.getElementById('tablebtn').onclick=openTable;

/* ---------- going to anything (search, table) ---------- */
function goTo(d){
  if(!d) return;
  if(d.place){ closeResults(); S.view='overview'; select(null); fitTo(d); return; }
  if(d.region){ S.reg=true; syncChip('reg'); S.view='overview'; S.tab='stories'; select(null); fitPts([d.c],3); return; }
  if(d.sub){ S.infra=true; syncChip('infra'); }
  if(d.osm){ S.osm=true; syncChip('osm'); if(S.year!==2026){ S.year=2026; yr.value=2026; updYear(); } S.types.add(d.t); syncType(d.t); }
  if(!d.osm&&!d.sub){ if(d.t!=='grid'&&!S.types.has(d.t)){ S.types.add(d.t); syncType(d.t); } if(future(d)&&!S.future){ S.future=true; syncChip('future'); }
    if(d.off&&S.year>=d.off){ S.year=d.off-1; yr.value=S.year; updYear(); } }
  S.cmp=false; select(d.key);
}
function syncType(t){ const b=chips.querySelector(`[data-k="${t}"]`); if(b) b.setAttribute('aria-pressed',S.types.has(t)); }

/* ---------- search everything ---------- */
const sIn=document.getElementById('search'), sRes=document.getElementById('results');
const PLACES=Object.entries(P).filter(([k,v])=>v[3]).map(([k,v])=>({key:'place_'+k,place:1,k,c:[v[1],v[2]]}));
const PC_RE=/^[A-Z]{1,2}[0-9][A-Z0-9]?(\s*[0-9][A-Z]{2})?$/i;
let sItems=[], sIdx=-1;
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function closeResults(){ sRes.classList.remove('open'); sIn.setAttribute('aria-expanded','false'); sIdx=-1; }
function runSearch(){
  const q=norm(sIn.value.trim()); if(q.length<2){ closeResults(); return; }
  const score=n=>{ const s=norm(n); if(!s) return -1; if(s.startsWith(q)) return 3; if(s.split(/[\s(\-]+/).some(w=>w.startsWith(q))) return 2; return s.includes(q)?1:-1; };
  const out=[];
  if(PC_RE.test(sIn.value.trim())) out.push({kind:'pc',label:sIn.value.trim().toUpperCase(),sub:tr('s_pc_go'),sc:9});
  ALL.forEach(d=>{ const s=Math.max(score(nm(d)),score(d.n)); if(s>0) out.push({kind:'site',d,label:nm(d),sub:tr('t_'+d.t)+(d.mw?' · '+fmtMW(d.mw):''),sc:s+2}); });
  PLACES.forEach(p=>{ const s=score(pn(p.k)); if(s>0) out.push({kind:'place',d:p,label:pn(p.k),sub:tr('s_place'),sc:s+1.5}); });
  REG.forEach(r=>{ const s=Math.max(score(r[1]),score(r[2])); if(s>0) out.push({kind:'region',d:{region:1,c:[r[3],r[4]]},label:LANG==='cy'?r[2]:r[1],sub:tr('s_region'),sc:s+1}); });
  SUBOBJ.forEach(o=>{ if(!o.nen) return; const s=score(o.nen); if(s>0) out.push({kind:'sub',d:o,label:o.nen,sub:tr('sub_t')+' · '+o.kv+' kV',sc:s}); });
  OTHERS.forEach(o=>{ if(!o.nen&&!o.ncy) return; const s=Math.max(score(o.nen),score(o.ncy)); if(s>0) out.push({kind:'osm',d:o,label:nm(o),sub:tr('t_'+o.t)+(o.mw?' · '+fmtMW(o.mw):''),sc:s-.5}); });
  out.sort((a,b)=>b.sc-a.sc||a.label.localeCompare(b.label));
  sItems=out.slice(0,9); sIdx=sItems.length?0:-1;
  sRes.innerHTML = sItems.length ? sItems.map((it,i)=>{ const t=it.d&&it.d.t; const c=it.kind==='sub'?SUBCOL(it.d.kv):t?col(t==='grid'?'grid':t):'var(--muted)';
      const ic=it.kind==='place'||it.kind==='region'||it.kind==='pc'?'':icon(it.kind==='sub'?'grid':t);
      return `<li role="option" id="sr${i}" aria-selected="${i===sIdx}" data-i="${i}"><span class="ri" style="--c:${c}">${ic}</span>${it.label}<small>${it.sub}</small></li>`; }).join('')
    : `<li class="none">${tr('s_none')}</li>`;
  sRes.classList.add('open'); sIn.setAttribute('aria-expanded','true');
  sRes.querySelectorAll('li[data-i]').forEach(li=>li.onmousedown=e=>{ e.preventDefault(); pick(+li.dataset.i); });
}
function pick(i){ const it=sItems[i]; if(!it) return; closeResults(); sIn.blur();
  if(it.kind==='pc'){ S.view='overview'; S.tab='map'; select(null); if(isSheet()) setSheet('half'); checkPostcode(it.label); return; }
  goTo(it.kind==='place'?it.d:it.kind==='region'?it.d:it.d); sIn.value=''; }
sIn.addEventListener('input',runSearch);
sIn.addEventListener('focus',()=>{ if(sIn.value.trim().length>=2) runSearch(); });
sIn.addEventListener('blur',()=>setTimeout(closeResults,120));
sIn.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!sItems.length) return; sIdx=(sIdx+(e.key==='ArrowDown'?1:-1)+sItems.length)%sItems.length;
    sRes.querySelectorAll('li[data-i]').forEach(li=>li.setAttribute('aria-selected',+li.dataset.i===sIdx)); sIn.setAttribute('aria-activedescendant','sr'+sIdx); }
  else if(e.key==='Enter'){ e.preventDefault(); if(sIdx>=0) pick(sIdx); } });

/* ---------- hover previews (mouse and trackpad only) ---------- */
const tip=document.getElementById('tip'); const canHover=matchMedia('(hover: hover) and (pointer: fine)').matches;
function tipHTML(d){
  let s=`<b>${nm(d)}</b><span>${d.sub?tr('sub_t')+' · '+d.kv+' kV':tr('t_'+d.t)+(d.mw?' · '+fmtMW(d.mw):'')}${!d.osm&&!d.sub&&!active(d)&&!(d.off&&S.year>=d.off)?' · '+(d.st==='con'?tr('con'):tr('dev'))+' '+d.on:''}</span>`;
  if(liveNow()&&FUEL[d.t]&&(d.osm?d.mw:active(d))&&!d.ps){ const r=d.osm?null:realMW(d), mw=r!=null?r:(d.osm?d.mw*fleet(d.t):liveMW(d)); s+=`<em>${r!=null?tr('tip_real',{v:fmtLive(mw)}):tr('tip_now',{v:fmtLive(mw)})}</em>`; }
  return s;
}
function showTip(d,x,y){ if(!canHover||mapwrap.classList.contains('moving')) return; tip.innerHTML=tipHTML(d); tip.style.display='block';
  const w=tip.offsetWidth, h=tip.offsetHeight; tip.style.left=Math.min(W-w-6,Math.max(6,x+14))+'px'; tip.style.top=Math.max(6,y-h-10)+'px'; }
function hideTip(){ tip.style.display='none'; }
if(canHover){
  gMarks.on('mouseover',e=>{ const g=e.target.closest('.mk'); if(!g) return; const d=d3.select(g).datum(); const r=node.getBoundingClientRect(); showTip(d,e.clientX-r.left,e.clientY-r.top); })
        .on('mouseout',e=>{ if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('.mk')) hideTip(); });
  gLinks.on('mouseover',e=>{ const g=e.target.closest('.lk'); if(!g) return; const d=d3.select(g).datum(); const [x,y]=d3.pointer(e,node); showTip(d,x,y); }).on('mouseout',hideTip);
  let raf=0; svg.on('mousemove.tip',e=>{ if(e.target!==node) return; cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>{ const [x,y]=d3.pointer(e,node); const h=dotQT&&dotQT.find(x,y,9);
    if(h){ showTip(h[2],x,y); node.style.cursor='pointer'; } else { hideTip(); node.style.cursor=''; } }); });
  svg.on('mouseleave.tip',hideTip);
}

new ResizeObserver(()=>{ if(isSheet()) applySheet(sheetSizes()[sheetState]); else applySheet(0); if(node.clientWidth!==W||node.clientHeight!==H) setup(); }).observe(stage);
if(isSheet()) setSheet('half');
buildChrome(); setup(); panel();
try{ if(!localStorage.getItem('pm_intro')) setTimeout(showIntro,400); }catch(e){ setTimeout(showIntro,400); }
refreshLive();
</script>
