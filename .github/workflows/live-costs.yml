# Today's running total of what it has cost to switch wind farms off and turn gas on.
# Every 30 minutes it recomputes today so far (a few whole-day calls to Elexon) and publishes ONE small
# file, today.json, to a separate branch called live-data. That branch is overwritten every time, so it
# never grows and never clutters the history of the main branch. The map reads it from there.
name: Live wind and gas costs

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Only print what Elexon returns, to diagnose a problem"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: live-costs
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe the feeds (diagnostic)
        if: ${{ inputs.probe }}
        run: python tools/update_costs.py --probe

      - name: Work out today so far (Elexon)
        run: python tools/update_costs.py --today --out "$RUNNER_TEMP/today.json"

      - name: Publish to the live-data branch
        run: |
          set -e
          mkdir "$RUNNER_TEMP/pub"
          cp "$RUNNER_TEMP/today.json" "$RUNNER_TEMP/pub/today.json"
          cd "$RUNNER_TEMP/pub"
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today.json
          git commit -q -m "Live costs $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:live-data
