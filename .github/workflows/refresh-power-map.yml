# Keeps the UK power map's data fresh.
#  - Every day: the offline snapshot, forecast accuracy, weekly digest and daily Wales
#    figures (NESO Carbon Intensity API); curtailment, station history and the cost of wind
#    turn-down and gas turn-up (Elexon);
#    carbon history, records and simulator data (NESO historic generation mix); the connection
#    queue and official constraint costs (NESO data portal); open data CSVs.
#  - On the 2nd of each month: also the OpenStreetMap grid, substations, smaller sites and routes.
# Then checks every dataset is fresh (tools/health.py), rebuilds index.html and commits it if anything
# changed. If a dataset has stopped updating it opens a GitHub issue, and closes it when all is well.
# Today's running total is a separate workflow (live-costs.yml, every 30 minutes).
#
# The map sits at the top level of the repository. If you move it into a subfolder,
# set MAP_DIR below to that folder's name.
name: Refresh UK power map data

on:
  schedule:
    - cron: "15 5 * * *"   # daily, 05:15 UTC
    - cron: "0 3 2 * *"    # monthly, 03:00 UTC on the 2nd
  workflow_dispatch:
    inputs:
      full:
        description: "Also refresh carbon history and OpenStreetMap data"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-power-map
  cancel-in-progress: false

env:
  MAP_DIR: "."   # folder containing index.html, src/, data/ and tools/ ("." = top level)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Decide what to refresh
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 3 2 * *" ] || [ "${{ inputs.full }}" = "true" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python packages
        working-directory: ${{ env.MAP_DIR }}
        run: pip install -r tools/requirements.txt

      - name: Refresh offline snapshot
        working-directory: ${{ env.MAP_DIR }}
        continue-on-error: true
        run: python tools/update_snapshot.py

      - name: Refresh curtailment and station history (Elexon)
        continue-on-error: true
        timeout-minutes: 40
        working-directory: ${{ env.MAP_DIR }}
        run: python tools/update_elexon.py

      - name: Refresh wind and gas costs (Elexon)
        continue-on-error: true
        timeout-minutes: 20
        working-directory: ${{ env.MAP_DIR }}
        run: python tools/update_costs.py

      - name: Refresh carbon history, records and simulator data
        continue-on-error: true
        working-directory: ${{ env.MAP_DIR }}
        run: python tools/update_history.py

      - name: Install osmium-tool
        if: steps.mode.outputs.full == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      - name: Refresh OpenStreetMap data and routes
        if: steps.mode.outputs.full == 'true'
        continue-on-error: true
        working-directory: ${{ env.MAP_DIR }}
        run: python tools/update_osm.py

      - name: Refresh connection queue and official constraint costs (NESO)
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ${{ env.MAP_DIR }}
        run: python tools/update_neso.py

      - name: Publish open data (CSV)
        continue-on-error: true
        working-directory: ${{ env.MAP_DIR }}
        run: python tools/export_open.py

      - name: Check every dataset is fresh
        continue-on-error: true
        working-directory: ${{ env.MAP_DIR }}
        run: python tools/health.py --issue-file "$RUNNER_TEMP/health_issue.md"

      - name: Build index.html
        working-directory: ${{ env.MAP_DIR }}
        run: python tools/build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$MAP_DIR"
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh power map data ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Raise, update or close the data-health issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-health --color B60205 --description "A dataset has stopped updating" --force || true
          n=$(gh issue list --label data-health --state open --json number --jq '.[0].number // empty')
          if [ -f "$RUNNER_TEMP/health_issue.md" ]; then
            if [ -n "$n" ]; then
              gh issue edit "$n" --body-file "$RUNNER_TEMP/health_issue.md"
            else
              gh issue create --title "Data refresh needs attention" --label data-health --body-file "$RUNNER_TEMP/health_issue.md"
            fi
          elif [ -n "$n" ]; then
            gh issue comment "$n" --body "Everything is updating normally again."
            gh issue close "$n"
          fi
