# Today's running total of what it has cost to switch wind farms off and turn gas on.
# Every ten minutes it asks Elexon, with one tiny request, whether a new half hour has been published.
# Only when it has (about every half hour) does it recompute today so far and publish ONE small file,
# today.json, to a separate branch called live-data. That branch is overwritten every time, so it never
# grows and never clutters the history of the main branch. The map reads it from there.
# (Elexon's settlement figures only exist once per half hour, so polling faster than this gains nothing.)
name: Live wind and gas costs

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Only print what Elexon returns, to diagnose a problem"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: live-costs
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the file published last time
        run: |
          git fetch --depth=1 origin live-data 2>/dev/null && git show FETCH_HEAD:today.json > "$RUNNER_TEMP/prev.json" || rm -f "$RUNNER_TEMP/prev.json"

      - name: Probe the feeds (diagnostic)
        if: ${{ inputs.probe }}
        run: python3 tools/update_costs.py --probe

      - name: Work out today so far (Elexon)
        run: |
          PREV=""
          if [ -s "$RUNNER_TEMP/prev.json" ]; then PREV="--prev $RUNNER_TEMP/prev.json"; fi
          python3 tools/update_costs.py --today --out "$RUNNER_TEMP/today.json" $PREV

      - name: Publish to the live-data branch
        run: |
          set -e
          if [ ! -s "$RUNNER_TEMP/today.json" ]; then echo "Nothing new to publish"; exit 0; fi
          mkdir "$RUNNER_TEMP/pub"
          cp "$RUNNER_TEMP/today.json" "$RUNNER_TEMP/pub/today.json"
          cd "$RUNNER_TEMP/pub"
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today.json
          git commit -q -m "Live costs $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:live-data
