<style>
:root{
  --sea:#cbdadf; --land:#e4e8e3; --land-uk:#fbfcfa; --coast:#98acb3;
  --ink:#1b282e; --muted:#5a6b71; --panel:#ffffff; --rule:#d6dee1; --soft:#eef2f3;
  --grid:#52636a; --hub:#1b282e; --pyl:#8d9ba0; --warn:#d6333a;
  --ow:#0f8b8d; --nw:#5b9a2e; --nu:#7a4fd1; --gas:#d2692a; --bio:#9a7b2c; --hy:#2f6fd0; --so:#d9a100; --ti:#0aa4c4; --bat:#607482; --ic:#c23b77;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sea:#0e1b21; --land:#1a252a; --land-uk:#2a383e; --coast:#41565e;
    --ink:#e6edef; --muted:#9fb1b7; --panel:#141f24; --rule:#2b3a40; --soft:#1c2a30;
    --grid:#9fb1b7; --hub:#e6edef; --pyl:#5d7078; --bat:#8fa3b0;
  }
}
:root[data-theme="dark"]{
  --sea:#0e1b21; --land:#1a252a; --land-uk:#2a383e; --coast:#41565e;
  --ink:#e6edef; --muted:#9fb1b7; --panel:#141f24; --rule:#2b3a40; --soft:#1c2a30;
  --grid:#9fb1b7; --hub:#e6edef; --pyl:#5d7078; --bat:#8fa3b0;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);touch-action:pan-x pan-y}
@supports (font: -apple-system-body){ html{font:-apple-system-body;font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif} }
body{height:100%;margin:0;background:var(--panel);overflow:hidden;max-width:100vw}
.app{max-width:100vw;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
@media (max-width:899px) and (orientation:portrait), (max-width:699px){ .app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);height:auto} }
header{padding:10px 14px 8px;border-bottom:1px solid var(--rule);background:var(--panel)}
.titlerow{display:flex;align-items:center;gap:8px;justify-content:space-between}
h1{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:-.01em;margin:0;line-height:1.1;flex:1;min-width:0}
h1 span{font-weight:500;color:var(--muted)}
.tools{display:flex;gap:6px;align-items:center;flex:none}
select,.tbtn{font:inherit;font-size:.9rem;color:var(--ink);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:5px 8px;max-width:100%}
.tbtn{cursor:pointer;font-weight:600;white-space:nowrap;min-height:34px;min-width:34px}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
/* search */
.search{position:relative;flex:1;min-width:0;max-width:340px}
.search.insheet{max-width:none;margin:0 16px 6px;flex:none}
.search input{width:100%;min-height:36px;font:inherit;font-size:.9rem;color:var(--ink);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:6px 9px 6px 28px}
.search svg.mag{position:absolute;left:8px;top:50%;width:14px;height:14px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;min-width:260px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);list-style:none;margin:0;padding:4px;z-index:30;max-height:60vh;overflow:auto;display:none}
.results.open{display:block}
.results li{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.9rem}
.results li[aria-selected="true"],.results li:hover{background:var(--soft)}
.results .ri{width:20px;height:20px;border-radius:50%;background:var(--c,var(--muted));display:grid;place-items:center;flex:none}
.results .ri svg{width:13px;height:13px;color:#fff}
.results small{margin-left:auto;color:var(--muted);font-size:.78rem;white-space:nowrap}
.results .none{color:var(--muted);cursor:default}
/* header buttons */
.tbtn svg{width:16px;height:16px;vertical-align:-3px}
.tbtn .lab{margin-left:5px}
/* overlays: layers, table, intro */
.pop{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:none}
.pop.open{display:block}
#layers{top:calc(env(safe-area-inset-top,0px) + 56px);right:14px;width:min(420px,calc(100vw - 20px));max-height:calc(100% - 80px);overflow:auto;padding:14px 16px}
#layers h4{margin:12px 0 6px;font-size:.8rem;text-transform:none;color:var(--muted);font-weight:600}
#layers h4:first-of-type{margin-top:0}
.pophead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pophead b{font-family:"Barlow Semi Condensed",sans-serif;font-size:1.15rem}
.xbtn{font:inherit;font-size:1.2rem;line-height:1;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 6px}
.linkbtn{font:inherit;font-size:.85rem;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;margin-top:12px}
.lgrab{display:none}
@media (max-width:599px){ .lgrab{display:flex;justify-content:center;height:24px;margin:-8px 0 2px;touch-action:none;cursor:grab} .lgrab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--rule);margin-top:6px} }
.chooser{position:absolute;z-index:26;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:4px;min-width:220px;max-width:280px}
.chooser .ch{font-size:.78rem;color:var(--muted);padding:4px 8px 2px}
.chooser button{all:unset;box-sizing:border-box;display:flex;gap:8px;align-items:center;width:100%;min-height:44px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:.92rem}
.chooser button:hover,.chooser button:focus-visible{background:var(--soft)}
.chooser .ri{width:22px;height:22px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none;color:#fff;font:700 .7rem "Barlow Semi Condensed",sans-serif}
.chooser .ri svg{width:14px;height:14px;color:#fff}
.chooser small{margin-left:auto;color:var(--muted);white-space:nowrap}
.coach{position:absolute;left:10px;bottom:calc(var(--sheet,0px) + 86px);z-index:25;max-width:320px;background:var(--ink);color:var(--panel);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-end}
.coach p{margin:0;font-size:.92rem;line-height:1.4}
.coach .pbtn{background:var(--panel);color:var(--ink);border-color:var(--panel);flex:none}
.coach::after{content:"";position:absolute;left:28px;bottom:-6px;width:12px;height:12px;background:var(--ink);transform:rotate(45deg)}
.coach.insheet{position:relative;left:auto;bottom:auto;margin:4px 16px 10px;max-width:none}
.coach.insheet::after{bottom:auto;top:-6px}
.scrim{position:fixed;inset:0;background:rgba(10,20,25,.35);z-index:35;display:none}
.scrim.open{display:block}
#intro{left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 28px));padding:20px 22px}
#intro h2{font-family:"Barlow Semi Condensed",sans-serif;margin:0 0 10px;font-size:1.4rem}
#intro ol{margin:0 0 16px;padding-left:1.2em;line-height:1.5}
#intro li{margin:6px 0}
#tablev{inset:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:none;flex-direction:column;padding:14px 16px}
#tablev.open{display:flex}
.tcontrols{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tcontrols input[type=text]{flex:1;min-width:140px;font:inherit;padding:6px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--soft);color:var(--ink)}
.tcontrols label{font-size:.85rem;display:flex;gap:5px;align-items:center}
.twrap{flex:1;overflow:auto;border:1px solid var(--rule);border-radius:8px}
table.sites{border-collapse:collapse;width:100%;font-size:.88rem}
table.sites th{position:sticky;top:0;background:var(--soft);text-align:left;font-weight:600;padding:7px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;user-select:none}
table.sites th[aria-sort="ascending"]::after{content:" ▲";font-size:.7em}
table.sites th[aria-sort="descending"]::after{content:" ▼";font-size:.7em}
table.sites td{padding:6px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.sites td.num{text-align:right;font-variant-numeric:tabular-nums}
table.sites tbody tr{cursor:pointer}
table.sites tbody tr:hover{background:var(--soft)}
table.sites .ti{display:inline-flex;align-items:center;gap:6px}
table.sites .ti svg{width:14px;height:14px;color:var(--c)}
.tcount{font-size:.8rem;color:var(--muted);margin-top:6px}
/* hover tip */
.tip{position:absolute;z-index:20;pointer-events:none;background:var(--panel);border:1px solid var(--rule);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:7px 10px;font-size:.85rem;max-width:260px;display:none;line-height:1.35}
.tip b{display:block;font-size:.92rem}
.tip span{color:var(--muted);display:block}
.tip em{font-style:normal;font-weight:600;display:block;margin-top:2px}
/* credits */
.attrib{position:absolute;right:6px;bottom:calc(var(--sheet,0px) + 2px);font:500 max(11px,.69rem) "Barlow",sans-serif;color:var(--muted);background:color-mix(in srgb,var(--panel) 88%,transparent);padding:1px 6px;border-radius:4px;z-index:3;max-width:calc(100% - 12px);text-align:right}
.attrib a{color:inherit}
.ashort{display:none}
/* compare */
.cmprow{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.cmprow select{font:inherit;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--soft);color:var(--ink)}
.ctab{width:100%;border-collapse:collapse;font-size:.88rem;margin:8px 0}
.ctab th,.ctab td{padding:5px 4px;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctab th:first-child,.ctab td:first-child{text-align:left}
.ctab td:first-child{display:flex;gap:6px;align-items:center}
.ctab td svg{width:14px;height:14px;color:var(--c)}
.ctab .up{color:#2fa84f}
.ctab4 td:first-child{align-items:flex-start}
.ctab4 td:first-child svg{margin-top:3px}
.ctab4 td small{display:block;color:var(--muted);font-size:.75rem;white-space:normal;line-height:1.3}
.ctab4 td:first-child span{white-space:normal}.ctab .down{color:var(--warn)}
.ctab tfoot td{font-weight:600;border-bottom:0}
.mk.cmp-new .ring{display:block;stroke:#2fa84f;stroke-width:3}
.mk.cmp-gone .dot{fill:var(--muted)!important}
.mk.cmp-gone .ring{display:block;stroke:var(--muted);stroke-width:2.5;stroke-dasharray:3 2}
/* bottom sheet (phones and small tablets) */
.sheet{display:flex;flex-direction:column;min-height:0}
.grab{display:none}
.chip{flex:none;font:inherit;font-size:.85rem;font-weight:500;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:4px 10px 4px 5px;display:flex;align-items:center;gap:6px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);display:block;margin-left:3px}
.chip .ib{width:18px;height:18px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none}
.chip .ib svg{width:12px;height:12px;color:#fff}
.chip.livechip i{background:var(--ic);box-shadow:0 0 0 3px color-mix(in srgb,var(--ic) 30%,transparent)}
.chip.ring i{background:transparent;border:1.5px dashed var(--ink)}
.chip.line i{height:0;border-radius:0;width:14px;border-top:2px dashed var(--grid);background:none}
.chip.pyl i{height:0;border-radius:0;width:14px;border-top:2px solid var(--pyl);background:none}
.chip.dots i{background:radial-gradient(circle,var(--muted) 30%,transparent 32%) 0 0/5px 5px;border-radius:2px}
.chip{min-height:34px}
.chip[aria-pressed="true"]{background:var(--soft);border-color:color-mix(in srgb,var(--ink) 35%,var(--rule))}
.chip[aria-pressed="true"]::after{content:"";width:10px;height:6px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg) translate(1px,-2px);margin-left:2px}
.chip[aria-pressed="false"]{opacity:.62}
.chip:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,.mk:focus-visible{outline:2px solid var(--ic);outline-offset:2px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column}
.mapwrap{position:relative;flex:1;min-height:0;background:var(--sea)}
#base,#dots,#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#dots{pointer-events:none}
#map{touch-action:none;cursor:grab;background:transparent}
.moving .lbl{display:none}
.moving .lf,.moving .flow{animation-play-state:paused}
.moving .lf,.moving .link,.moving .flow,.moving .flowbase{vector-effect:non-scaling-stroke}
.lf.still{animation:none;stroke-dasharray:none;opacity:.45}
.mk.compact .ico{display:none}
#map:active{cursor:grabbing}
.land path{fill:var(--land);stroke:var(--coast);stroke-width:.6;vector-effect:non-scaling-stroke}
.land path.uk{fill:var(--land-uk)}
.pyl path{fill:none;stroke:var(--pyl);vector-effect:non-scaling-stroke;stroke-linejoin:round}
.pyl path.v400{stroke-width:1.1}
.pyl path.v275{stroke-width:.7;stroke-dasharray:none;opacity:.8}
.pyl path.vdc{stroke-width:.8;stroke-dasharray:3 3;opacity:.7}
.pyl path.v220{stroke-width:.6;opacity:.7}
.warea path{fill:#cfe6e2;stroke:#8fbdb5;stroke-width:.6;vector-effect:non-scaling-stroke;display:none}
.infra .warea path{display:block}
.infra .pyl path.v400{stroke:#4f5bd5;stroke-width:1.5;opacity:1}
.infra .pyl path.v275{stroke:#d9453b;stroke-width:1.2;opacity:1}
.infra .pyl path.v220{stroke:#39a7d8;stroke-width:1.1;opacity:1}
.infra .pyl path.vdc{stroke:#b0407a;stroke-width:1.3;stroke-dasharray:5 4;opacity:1}
.ilegend{position:absolute;right:54px;top:10px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font:500 .78rem "Barlow",sans-serif;color:var(--ink);display:none;line-height:1.7}
.infra-on .ilegend{display:block}
.ilegend b{display:block;font-weight:600;margin-top:2px}
.ilegend i{display:inline-block;width:18px;vertical-align:middle;margin-right:6px}
.ilegend i.l{border-top:2px solid}.ilegend i.d{border-top:2px dashed #b0407a}
.ilegend i.s{width:8px;height:8px;margin:0 11px 0 5px}
.ilegend i.a{width:14px;height:10px;background:#cfe6e2;border:1px solid #8fbdb5;margin-right:10px}
@media (max-width:599px){.ilegend{top:auto;bottom:calc(var(--sheet,0px) + 82px);right:10px}}
.regdot{stroke:var(--panel);stroke-width:2}
.rg{cursor:pointer;outline:none}
.reghit{fill:transparent}
.rg.on .regdot{stroke:var(--ink);stroke-width:3}
.rg:focus-visible .regdot{stroke:var(--ic);stroke-width:3}
.rega path.on{fill-opacity:.55;stroke:var(--ink);stroke-width:2}
.rega path.off{fill-opacity:.12}
.rega path{fill-opacity:.38;stroke:var(--panel);stroke-width:1.2;vector-effect:non-scaling-stroke}
.regtxt{font:700 11px "Barlow Semi Condensed",sans-serif;fill:#fff;pointer-events:none;text-anchor:middle}
.srcs{list-style:none;padding:0;margin:4px 0;font-size:.85rem}
.srcs li{padding:3px 0;border-bottom:1px solid var(--rule);line-height:1.4}
.srcs a{color:var(--ink)}
.badge{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;margin-left:6px;vertical-align:1px}
.badge.ok{color:#2fa84f}.badge.chk{color:#c77700}.badge.none{color:var(--muted)}
.hbar{display:grid;grid-template-columns:8.5em 1fr auto;gap:4px 8px;align-items:center;font-size:.85rem;margin:6px 0}
.hbar .b{height:12px;border-radius:2px;background:var(--c,var(--ink))}
.hbar b{font-variant-numeric:tabular-nums;font-weight:600}
.story{border-top:1px solid var(--rule);padding-top:10px;margin-top:14px}
.story h3{margin-top:0;font-size:1.05rem}
.plan{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.plan label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600}
.plan select,.plan input{font:inherit;font-size:1rem;font-weight:400;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--soft);color:var(--ink);min-height:40px}
.plrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan .pbtn{min-height:44px;font-size:1rem}
.scen{border:1px dashed var(--rule);border-radius:10px;padding:10px 12px;margin:10px 0}
.scen h4{margin:0 0 8px;font-size:.95rem}
.ctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
@media (pointer:coarse){ #zin,#zout{display:none} }
.ctl button{width:34px;height:34px;border-radius:6px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);font:600 1.1rem "Barlow",sans-serif;cursor:pointer;display:grid;place-items:center}
.pills{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 64px)}
.cipill,.status{min-height:32px;position:relative}
.cipill::after,.status::after{content:"";position:absolute;inset:-6px -2px}
.cipill{background:var(--panel);border:1px solid var(--rule);border-left:5px solid var(--cic,var(--muted));border-radius:999px;padding:3px 10px 3px 8px;font:500 .8rem "Barlow",sans-serif;color:var(--ink);cursor:pointer;display:flex;gap:5px;align-items:baseline}
.cipill b{font:700 1rem "Barlow Semi Condensed",sans-serif}
.cipill{display:grid!important;grid-template-columns:auto auto auto;grid-template-rows:auto auto;column-gap:6px;row-gap:0;align-items:center;border-radius:16px;padding:4px 12px 4px 9px;text-align:left}
.cipill .ldot{grid-row:1/3;grid-column:1}
.cipill b{grid-row:1/3;grid-column:2;font-size:1.25rem!important;line-height:1}
.cipill .ciu{grid-row:1;grid-column:3;line-height:1.2}
.cipill .cist{grid-row:2;grid-column:3;font:500 max(11px,.7rem) "Barlow",sans-serif;color:var(--muted);line-height:1.2;white-space:nowrap}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.cipill.live .ldot{background:#2fa84f;box-shadow:0 0 0 3px color-mix(in srgb,#2fa84f 30%,transparent)}
@media (prefers-reduced-motion:no-preference){ .cipill.live .ldot{animation:pulse 2s ease-in-out infinite} }

h3{font-size:.95rem;font-weight:600;margin:16px 0 4px}

.why{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin:12px 0;background:var(--soft)}

.whyh::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--wc,var(--muted))}
.why.vclean,.why.clean{--wc:#2fa84f}.why.typical{--wc:#8a9aa0}.why.dirty{--wc:#e8772e}.why.vdirty{--wc:#d6333a}

.whyl{list-style:none;padding:0;margin:6px 0;font-size:.9rem}

.curtwhere{margin:8px 0 2px;font-weight:500;font-size:.92rem;color:var(--ink)}

.livebox #curtall{margin:4px 0 2px;display:block}

.hicon{width:26px;height:26px;border-radius:50%;background:var(--c);display:inline-grid;place-items:center;vertical-align:-6px;margin-right:6px}

.row{display:flex;gap:8px;align-items:center;margin:8px 0}

.rdot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block;align-self:center}
.chart{width:100%;margin:6px 0 2px;position:relative}

.cexp{position:absolute;top:-2px;right:0;width:32px;height:32px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.cexp svg{width:16px;height:16px}
#chartv{inset:calc(env(safe-area-inset-top,0px) + 24px) 24px auto;max-width:900px;margin:0 auto;padding:14px 18px;max-height:calc(100% - 48px);overflow:auto}

.chart.big{margin:4px 0 6px;cursor:crosshair}

.chart .hvbox{fill:var(--panel);stroke:var(--rule)}
.chart .hvt{font:12px "Barlow",sans-serif;fill:var(--ink)}
.chart svg{display:block;width:100%;overflow:visible}
.chart .ax text{font:500 10.5px "Barlow",sans-serif;fill:var(--muted)}
.chart .ax line,.chart .ax path{stroke:var(--rule)}
.chart .act{fill:none;stroke:var(--ink);stroke-width:2}
.chart .fc{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:4 3;opacity:.7}

.chart .pt.ytd{stroke-dasharray:2 1.5}

.chart .vlp{font:600 10.5px "Barlow",sans-serif;fill:#2fa84f}
.key{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-bottom:4px}

.key i.d{border-top-style:dashed}.key i.g{border-top-color:#2fa84f;border-top-style:dashed}
/* map overlay */
.link{fill:none;stroke-width:2;stroke-linecap:round}
.link.ic{stroke:var(--ic);opacity:.7;stroke-width:1.1}
.link.grid{stroke:var(--grid);stroke-dasharray:5 4;opacity:.8}
.link.fut{stroke-dasharray:2 5;opacity:.6}
.hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer;pointer-events:stroke}
.dim .link,.dim .mk,.dim .od{opacity:.28}
.dim .link.on,.dim .mk.on{opacity:1}
.mk{cursor:pointer;outline:none}
.mk .dot{stroke:var(--panel);stroke-width:1.5}
.mk .ico{color:#fff;pointer-events:none}
.mk.fut .dot{fill:var(--panel)!important;stroke:var(--c);stroke-width:2;stroke-dasharray:3 2}
.mk.fut .ico{color:var(--c)}
.mk .ring{fill:none;stroke:var(--ink);stroke-width:2;display:none}
.mk.on .ring{display:block}
.mk .curt{fill:none;stroke:var(--warn);stroke-width:2.5;display:none;animation:pulse 1.4s ease-in-out infinite}

@keyframes pulse{50%{stroke-opacity:.25}}
.od{cursor:pointer;stroke:var(--panel);stroke-width:.8}
.wview .od.nw{opacity:.35}
.od.on{stroke:var(--ink);stroke-width:2}
.lf{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1.5 7;opacity:.8;animation:run linear infinite}
.lf.rev{animation-direction:reverse}
.dim .lf{opacity:.1}
.flowbase{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.25}

.hubdot{fill:var(--hub);stroke:var(--panel);stroke-width:2}

.recs small{display:block;font-weight:500;color:var(--muted);margin-top:2px}
.recs em{font-style:normal;font-weight:700;color:#1f7a39;background:color-mix(in srgb,#2fa84f 16%,transparent);border-radius:4px;padding:0 4px}
.story h4,.cth{margin:14px 0 4px;font-size:.95rem}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);background:var(--ink);color:var(--panel);font-weight:600;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}

.prbars{list-style:none;padding:0;margin:6px 0}
.prbars li{border-top:1px solid var(--rule)}
.prbars button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:8.5em 1fr 5.4em;gap:8px;align-items:center;width:100%;padding:6px 2px;min-height:40px;font-size:.88rem}
.prbars .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prbars .pb{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.prbars .pb i{display:block;height:100%;border-radius:5px}
.prbars b{text-align:right;font-variant-numeric:tabular-nums}
.prbars button:hover .pn,.prbars button:focus-visible .pn{text-decoration:underline;text-underline-offset:3px}
.prbars button:focus-visible{outline:2px solid var(--ic);outline-offset:1px}
.subs{font-size:.9rem;border-left:3px solid var(--rule);padding:4px 0 4px 10px;margin:10px 0;line-height:1.45}
.subs span{color:var(--muted)}
.wkbtn{margin:8px 0}
.wk .wkwhen{font:700 1.35rem "Barlow Semi Condensed",sans-serif;margin:10px 0 4px}
.wkctl{align-items:center;gap:10px;flex-wrap:nowrap}
.wkctl input[type=range]{flex:1;min-width:0}
.wkctl .pbtn{min-width:5.2em}
.qlayer circle{fill-opacity:.55;stroke:var(--panel);stroke-width:1.2;cursor:pointer}
.qlayer g.qs.on circle{fill-opacity:.9;stroke:var(--ink);stroke-width:2}
.qlayer g.qs:focus-visible circle{stroke:var(--ic);stroke-width:3}
#map.queueon g.mk{opacity:.22}
#map.queueon path.lf{display:none}
.qt{width:100%;border-collapse:collapse;font-size:.85rem;margin:4px 0}
.qt th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--rule);padding:4px 4px 4px 0}
.qt td{border-bottom:1px solid var(--rule);padding:5px 4px 5px 0;vertical-align:top}
.qt td:nth-child(2),.qt th:nth-child(2){text-align:right;white-space:nowrap}
.ti.sm{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:middle}
.qlist .ti{width:14px;height:14px}
.wtbar{position:relative;height:14px;background:var(--soft);border-radius:7px;margin:14px 0 30px}
.wtbar i{display:block;height:100%;background:#2fa84f;border-radius:7px}
.wtm{position:absolute;top:-4px;height:22px;border-left:2px dashed var(--ink);font-size:.72rem;color:var(--muted);padding:24px 0 0;transform:translateX(-1px);white-space:nowrap}
.wtm b{color:var(--ink);margin-right:3px}
.wtm:last-child{transform:translateX(-100%);border-left:0;border-right:2px dashed var(--ink);text-align:right}
.wkchip{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);z-index:6;display:flex;align-items:center;gap:10px;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:6px 14px;box-shadow:0 2px 10px rgba(0,0,0,.14);font:inherit;cursor:pointer;white-space:nowrap}
.wkchip[hidden]{display:none}
.wkchip b{font:700 .95rem "Barlow Semi Condensed",sans-serif}
.wkchip span{font-size:.8rem;color:var(--warn);font-weight:600}
.wkchip i{font-style:normal;font-size:.75rem;color:var(--muted)}
@media (min-width:900px){ .wkchip{top:18px} }
.seg{display:grid;grid-template-columns:repeat(2,1fr)}
#map.h2on g.mk{opacity:.22}
#map.h2on path.lf{display:none}
.h2layer g.h2s path{fill:#2aa7e0;stroke:var(--panel);stroke-width:1.6;cursor:pointer}
.h2layer g.h2s[data-st=pau] path,.h2layer g.h2s[data-st=pre] path,.h2layer g.h2s[data-st=pla] path{fill:var(--panel);stroke:#2aa7e0;stroke-width:2.4}
.h2layer g.h2s[data-st=pau] path{stroke-dasharray:4 3}
.h2layer g.h2s[data-st=op] path{stroke:#fff;stroke-width:2.6}
.h2layer g.h2s.on path,.h2layer g.h2s:focus-visible path{stroke:var(--ink);stroke-width:3.2}
.h2layer path.h2pipe{fill:none;stroke:#2aa7e0;stroke-width:7;stroke-dasharray:.1 11;stroke-linecap:round;cursor:pointer}
.h2layer path.h2pipe.on{stroke:var(--ink)}
.h2key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);margin:10px 0 2px}
.h2key span{display:inline-flex;align-items:center;gap:5px}
.h2sym{flex:none;display:block}
.h2list .cn{gap:10px}
.h2stat{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.h2stat b{font:700 1.05rem "Barlow Semi Condensed",sans-serif}
.h2stat span{font-size:.8rem;color:var(--muted)}

const METHOD_DOC = {"en": [["data", "What the map shows", "<p>The map brings together public data about Britain’s electricity system. Major sites (power stations, interconnectors and grid links) are compiled by hand from public announcements and checked against OpenStreetMap. Grid lines, substations, smaller generators and wind farm outlines come from OpenStreetMap, refreshed monthly. Live figures come from NESO and Elexon every five minutes. Every site panel lists its own sources.</p><p>If the live feeds can’t be reached, the map shows the latest stored snapshot instead and says so in the status pill.</p>"], ["live", "Live output of each power station", "<p>Where a station reports to Elexon, the figure is its <b>physical notification</b>: the output the station told the grid operator it planned to produce for that half-hour. It is not a meter reading. When the grid operator pays a station to turn down, that instruction is shown separately as curtailment.</p><p>Where no report is available, output is <b>estimated</b>: the station’s capacity multiplied by how hard that technology is running across Britain, from NESO’s national mix. The panel says which method was used.</p>"], ["routes", "Where the electricity goes", "<p>Routes follow real 400 kV and 275 kV pylon lines from OpenStreetMap, found with a shortest-path search on the line network. Once electricity joins the grid it mixes with everything else, so a route shows the <b>typical direction of flow</b>, not a fixed destination.</p>"], ["carbon", "Carbon intensity", "<p>Carbon intensity is the CO₂ emitted per kilowatt-hour of electricity (gCO₂/kWh). Two measures appear on the map. The <b>history</b> uses NESO’s historic generation mix, which counts electricity generated in Britain plus imports. The <b>live and forecast</b> figures come from NESO’s Carbon Intensity API, which estimates electricity consumed, including imports. They usually differ by 10 to 30 g.</p><p>Regional figures are NESO’s estimates for its 14 regions. Import figures use NESO’s average factor for each country, not live data from that country.</p>"], ["why", "“Why now”", "<p>“Typical” is the average for the same month and half-hour of the day over the last two years of NESO’s historic data. The card calls a reading unusual if it is among the cleanest or dirtiest 10% for that time. It then lists the sources whose share differs most from typical.</p>"], ["curt", "Curtailment, payments and CO₂", "<p>Curtailment is read from the grid operator’s accepted instructions to reduce output (Elexon balancing acceptances). Payments use each station’s bid price for the half-hour. The extra CO₂ assumes the lost power is replaced by combined-cycle gas at NESO’s factor of 394 gCO₂/kWh, which is an estimate. The Eastern Green Link scenario assumes the new capacity carries curtailed Scottish wind straight to demand in England. In practice, other bottlenecks can limit this.</p>"], ["plan", "When to run it", "<p>The Plan tab averages NESO’s 48-hour carbon intensity forecast over every possible start time for your running time, then picks the lowest. CO₂ is your power multiplied by hours, multiplied by that average. Cost isn’t included, because wholesale prices aren’t forecast publicly.</p>"], ["acc", "Forecast accuracy", "<p>Every morning at about 05:15 UTC, the daily refresh saves NESO’s national forecast for the next 24 hours. After those 24 hours have passed, it compares each half-hour with NESO’s measured figure. The <b>typical error</b> is the average size of the miss in either direction, and the <b>bias</b> is the average signed miss.</p><p>“Cleanest window found” asks the practical question behind the Plan tab: if you had started at the forecast’s cleanest 3-hour window, would you have been within 10 g of the truly cleanest window? The record is kept in <code>data/accuracy.json</code> in the map’s repository.</p>"], ["sim", "2030 simulator", "<p>The simulator replays one real year, hour by hour: demand and the output of wind, solar, nuclear, biomass and hydro from NESO’s historic generation mix. It scales each hour’s output by the capacity you choose, compared with the capacity that actually existed that year (from the Clean Power 2030 Action Plan annex). Wind is scaled by expected output, not capacity alone, because offshore turbines produce more per gigawatt (assumed 40% of capacity on average, against 27% onshore).</p><p>Each hour, it meets demand in this order:</p><ol><li>clean generation</li><li>batteries (2 hours of storage, 85% round trip) and long-duration storage (8 hours, 75%)</li><li>new low-carbon dispatchable plant (assumed 50 g/kWh)</li><li>imports, following the same year’s pattern scaled to your interconnector capacity</li><li>gas</li></ol><p>Surplus power charges storage first, then goes to exports (up to 60% of interconnector capacity), and anything left is turned down. Carbon intensity counts British generation plus imports, as NESO’s historic figures do: gas at 394 g, biomass at 120 g, other fuels at 300 g and imports at 50 g, all per kWh. The import figure is the one that best reproduces 2024’s daily carbon intensity, and suits imports that come mostly from French nuclear and Norwegian hydro.</p><p><b>What it leaves out:</b></p><ul><li>limits on the grid inside Britain, so it understates curtailment</li><li>the gas plant the grid needs running for stability</li><li>demand that shifts its timing</li><li>weather in other years</li><li>costs</li></ul><p>The model check shows how closely it reproduces the real base year: for 2024 its average is within about 1 g of what was measured, and its daily figures are typically within 5 g. With NESO’s 2030 capacities it lands a little below NESO’s own result of 95% clean, mainly because it doesn’t move any demand in time. NESO’s scenarios count on 10–12 GW of flexible demand, such as smart EV charging.</p>"], ["digest", "Weekly digest", "<p>Each day the refresh checks whether a full Monday-to-Sunday week (UK time) has ended. If it has, it summarises that week from NESO’s Carbon Intensity API: measured intensity where available (forecast otherwise), the generation mix and regional estimates. The text is written from those numbers by fixed rules, not by hand. Records compare with the weeks stored since the digest began and with the lowest half-hour in NESO’s history since 2009.</p>"], ["history", "Curtailment tracker and station history", "<p>Every morning the refresh reads each of the previous day’s half-hours from Elexon: each station’s notified output, the grid operator’s accepted instructions and the bid prices. For each mapped station, <b>turn-down</b> is the gap between its notified output and the level it was instructed to, and <b>payments</b> use its bid price for that half-hour. The daily totals cover the wind farms on the map with a known Elexon unit, so they understate the total for Britain.</p><p>Station history shows the last 14 days, hour by hour: notified output, with the part that was turned down shaded. The tracker keeps each wind farm’s daily figures for about four months and the daily totals for just over two years.</p>"], ["records", "Records and milestones", "<p>Britain’s records come from NESO’s historic generation mix, half-hour by half-hour since 2009, refreshed daily. Every record and milestone uses that one dataset, so nothing is ever a “record” just because two measures differ. A milestone appears when a day sets an all-time record, or is the cleanest day for at least 30 days.</p><p>Wales isn’t split out in that dataset, so the Wales row uses NESO’s live regional estimates, recorded daily, and is only ever compared with itself.</p>"], ["share", "Sharing a view", "<p><b>Share this view</b> copies a link that opens the map as you see it: the tab, the selected site or region, the year, the Wales view, your simulator settings or the digest week. Nothing is stored anywhere. Everything is in the link itself.</p>"], ["subsidy", "Switch-off prices and support schemes", "<p>A wind farm paid to turn down names its price in the Balancing Mechanism. That price is roughly the income it gives up by not generating, and for most wind farms that is subsidy:</p><ul><li><b>Renewables Obligation</b> (older wind farms): every MWh earns certificates worth well over £50, often more than one per MWh offshore.</li><li><b>Early Contracts for Difference</b> (the 2014 investment contracts): a guaranteed price of £140–150/MWh in 2012 prices, far above today’s market, topped up on every MWh generated.</li><li><b>Auction Contracts for Difference</b>: guaranteed prices near or below today’s market price, so little is lost when switched off.</li></ul><p>The switch-off price shown is a wind farm’s payments divided by the energy it was turned down by, over the last 30 days. Farms turned down by less than 200 MWh are left out, because a few half-hours can give a misleading price. Each farm’s scheme, award year and strike price are listed in <code>data/subsidy.json</code>, with sources.</p>"], ["replay", "Replaying the last 7 days", "<p>The replay uses the hourly history the daily refresh stores for every station that reports to Elexon: the output it planned and the part the grid operator paid it to turn down. Output shown on the map is planned output minus turn-down. Sites that don’t report to Elexon are hidden, because their output would be an estimate for the present, not for that hour.</p>"], ["queue", "The connection queue", "<p>NESO’s Transmission Entry Capacity (TEC) register lists every project with a contract to connect to the transmission grid. The refresh reads it every day. A project counts as queued if its contracted capacity is due to increase and it isn’t marked as built. NESO notes that some capacity is repeated across stages and technologies, so rows with the same project, stage, size and date are counted once.</p><p>Each connection site is placed on the map by matching its name to substations and power stations in OpenStreetMap, and to the map’s own sites. Sites that can’t be matched are still counted, and listed as not on the map. “Contracted date passed” is capacity whose contracted connection date is already in the past but isn’t built. Plenty of it is waiting for the grid to be reinforced, not for the developer.</p><p>A contract to connect is not a promise to build; many projects in the queue never are. Connections reform is re-ordering the queue into Gate 1 and Gate 2 projects, so expect large changes.</p>"], ["official", "Checking the tracker against NESO", "<p>NESO publishes its daily constraint costs by category each week. The tracker compares its own daily payments to wind farms with NESO’s <b>thermal constraint</b> cost, the category that covers turning wind down when the grid can’t carry its power. The two are not expected to match. NESO’s figure also includes turning other generators up to replace the lost power (usually gas in England), trades, and wind farms this map doesn’t track. The share should be broadly steady; a sudden change is a sign something has gone wrong, in either dataset.</p>"], ["wales", "Wales against its targets", "<p>The Welsh Government measures its targets as renewable generation in Wales in a year, divided by electricity consumed in Wales in that year. The figures come from its <i>Energy Generation and Energy Use in Wales</i> report (2026 edition, data to 2024). The report gives 54% in some places and 55% in others; the map uses 54%, the figure in the ministerial statement. The live Welsh mix comes from NESO’s regional estimates, which measure a different thing (the mix of electricity used in Wales in each half-hour), so it can’t be compared directly with the targets.</p>"], ["hydrogen", "Hydrogen projects and pipeline", "<p>This layer is curated by hand, not pulled from a live feed, because no public dataset covers hydrogen projects and pipelines. The electrolyser projects are the 11 winners of the government’s first hydrogen allocation round (DESNZ, December 2023). Their status comes from later reports: company announcements, trade press and an independent tracker (HyCalc), all linked on each entry. “Contract signed” means a first-round contract was signed in 2025; progress after that was not individually confirmed. Positions are approximate, at town or cluster level.</p><p>The pipeline line is an indicative corridor between Teesside, the Humber and the East Midlands, drawn from National Gas’s description of Project Union: East Coast. It is not the surveyed route. The second-round shortlist (27 projects, 765 MW, April 2025) is counted in the text but not mapped, because its sites were not verified.</p><p>Hydrogen plans are changing quickly, and several projects were paused or cancelled in 2025. Each entry shows when its status was last checked. Treat the layer as a snapshot and check the linked sources. Everything is in <code>data/hydrogen.json</code> with sources, and corrections are welcome.</p>"], ["open", "Open data", "<p>Everything the map collects is published as CSV files, refreshed daily, at stable addresses. <a href=\"data/open/index.json\">index.json</a> describes each file, its columns and its licence.</p><ul><li><a href=\"data/open/curtailment-daily.csv\" download>Wind turned down, daily totals</a> <code>curtailment-daily.csv</code></li><li><a href=\"data/open/curtailment-by-windfarm.csv\" download>Wind turned down, by wind farm, with support scheme and £/MWh</a> <code>curtailment-by-windfarm.csv</code></li><li><a href=\"data/open/station-output-hourly.csv\" download>Station output and turn-down, hourly, last 14 days</a> <code>station-output-hourly.csv</code></li><li><a href=\"data/open/carbon-daily.csv\" download>Carbon intensity and wind share, daily</a> <code>carbon-daily.csv</code></li><li><a href=\"data/open/weekly-digest.csv\" download>Weekly summary</a> <code>weekly-digest.csv</code></li><li><a href=\"data/open/forecast-accuracy.csv\" download>Forecast accuracy</a> <code>forecast-accuracy.csv</code></li><li><a href=\"data/open/records.csv\" download>Britain’s electricity records</a> <code>records.csv</code></li><li><a href=\"data/open/connection-queue-by-site.csv\" download>Connection queue, by connection site</a> <code>connection-queue-by-site.csv</code></li><li><a href=\"data/open/official-constraint-costs.csv\" download>NESO constraint costs beside the tracked wind payments</a> <code>official-constraint-costs.csv</code></li><li><a href=\"data/open/hydrogen-projects.csv\" download>Hydrogen projects and pipeline, with status</a> <code>hydrogen-projects.csv</code></li></ul><p><b>Licence.</b> These files are shared under <a href=\"https://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" rel=\"noopener\">CC BY 4.0</a>: you can copy, share, adapt and use them, including commercially, as long as you give credit. The connection queue file is the exception: it includes locations derived from OpenStreetMap, so it is shared under the <a href=\"https://opendatacommons.org/licenses/odbl/1-0/\" target=\"_blank\" rel=\"noopener\">Open Database Licence (ODbL)</a> instead.</p><p><b>How to credit it.</b> “The UK Power Flow, by Daniel Elwyn Thomas” with a link to this site, for example: <i>Data: The UK Power Flow (Daniel Elwyn Thomas), CC BY 4.0.</i></p><p><b>Original sources.</b> The numbers underneath come from others, and their terms apply too: NESO (NESO Open Data Licence), Elexon (contains BMRS data © Elexon Limited copyright and database right), and OpenStreetMap contributors (ODbL). What is licensed here is the compilation: the daily tracking, matching and calculations. The data comes with no warranty, so please check anything important against the original sources.</p>"], ["limits", "Known limitations", "<ul><li>Future dates are developer or government targets, and they often slip.</li><li>OpenStreetMap is mapped by volunteers, so some entries are out of date.</li><li>Northern Ireland runs a separate grid shared with Ireland.</li><li>Estimated outputs assume every site of a technology runs equally hard, which is never quite true.</li></ul>"]], "cy": [["data", "Beth mae’r map yn ei ddangos", "<p>Mae’r map yn dod â data cyhoeddus am system drydan Prydain at ei gilydd. Mae’r prif safleoedd (gorsafoedd pŵer, rhyng-gysylltwyr a chysylltiadau grid) wedi’u casglu â llaw o gyhoeddiadau cyhoeddus a’u gwirio yn erbyn OpenStreetMap. Daw llinellau’r grid, is-orsafoedd, cynhyrchwyr llai ac amlinellau ffermydd gwynt o OpenStreetMap, ac maen nhw’n cael eu diweddaru’n fisol. Daw’r ffigurau byw gan NESO ac Elexon bob pum munud. Mae panel pob safle yn rhestru ei ffynonellau ei hun.</p><p>Os na ellir cyrraedd y ffrydiau byw, mae’r map yn dangos y ciplun diweddaraf sydd wedi’i gadw, ac mae’r bilsen statws yn dweud hynny.</p>"], ["live", "Allbwn byw pob gorsaf bŵer", "<p>Lle mae gorsaf yn adrodd i Elexon, y ffigur yw ei <b>hysbysiad ffisegol</b>: yr allbwn y dywedodd yr orsaf wrth weithredwr y grid ei bod yn bwriadu ei gynhyrchu ar gyfer yr hanner awr honno. Nid darlleniad mesurydd yw hwn. Pan fydd gweithredwr y grid yn talu gorsaf i droi i lawr, mae’r cyfarwyddyd hwnnw’n cael ei ddangos ar wahân fel cwtogi.</p><p>Lle nad oes adroddiad ar gael, mae’r allbwn yn <b>amcangyfrif</b>: capasiti’r orsaf wedi’i luosi â pha mor galed mae’r dechnoleg honno’n rhedeg ar draws Prydain, o gymysgedd cenedlaethol NESO. Mae’r panel yn dweud pa ddull a ddefnyddiwyd.</p>"], ["routes", "I ble mae’r trydan yn mynd", "<p>Mae’r llwybrau’n dilyn llinellau peilonau 400 kV a 275 kV go iawn o OpenStreetMap, wedi’u canfod drwy chwilio am y llwybr byrraf ar rwydwaith y llinellau. Unwaith y bydd trydan yn ymuno â’r grid mae’n cymysgu â phopeth arall, felly mae llwybr yn dangos <b>cyfeiriad arferol y llif</b>, nid pen draw penodol.</p>"], ["carbon", "Dwysedd carbon", "<p>Dwysedd carbon yw’r CO₂ a allyrrir am bob cilowat-awr o drydan (gCO₂/kWh). Mae dau fesur ar y map. Mae’r <b>hanes</b> yn defnyddio cymysgedd cynhyrchu hanesyddol NESO, sy’n cyfrif y trydan a gynhyrchir ym Mhrydain ynghyd â mewnforion. Daw’r ffigurau <b>byw a’r rhagolygon</b> o API Dwysedd Carbon NESO, sy’n amcangyfrif y trydan a ddefnyddir, gan gynnwys mewnforion. Maen nhw fel arfer yn wahanol o 10 i 30 g.</p><p>Amcangyfrifon NESO ar gyfer ei 14 rhanbarth yw’r ffigurau rhanbarthol. Mae’r ffigurau mewnforio yn defnyddio ffactor cyfartalog NESO ar gyfer pob gwlad, nid data byw o’r wlad honno.</p>"], ["why", "“Pam nawr”", "<p>“Arferol” yw’r cyfartaledd ar gyfer yr un mis a’r un hanner awr o’r dydd dros ddwy flynedd ddiwethaf data hanesyddol NESO. Mae’r cerdyn yn galw darlleniad yn anarferol os yw ymhlith y 10% glanaf neu fwyaf budr ar gyfer yr adeg honno. Yna mae’n rhestru’r ffynonellau y mae eu cyfran fwyaf gwahanol i’r arfer.</p>"], ["curt", "Cwtogi, taliadau a CO₂", "<p>Mae cwtogi’n cael ei ddarllen o gyfarwyddiadau derbyniedig gweithredwr y grid i leihau allbwn (derbyniadau cydbwyso Elexon). Mae’r taliadau’n defnyddio pris cynnig pob gorsaf ar gyfer yr hanner awr. Mae’r CO₂ ychwanegol yn tybio bod nwy cylch cyfun yn cymryd lle’r pŵer a gollwyd, ar ffactor NESO o 394 gCO₂/kWh, ac amcangyfrif yw hynny. Mae senario Cyswllt Gwyrdd y Dwyrain yn tybio bod y capasiti newydd yn cludo gwynt yr Alban a gafodd ei gwtogi yn syth i’r galw yn Lloegr. Yn ymarferol, gall tagfeydd eraill gyfyngu ar hyn.</p>"], ["plan", "Pryd i’w redeg", "<p>Mae’r tab Cynllunio yn cyfartalu rhagolwg dwysedd carbon 48 awr NESO dros bob amser cychwyn posibl ar gyfer eich amser rhedeg, ac yna’n dewis yr isaf. CO₂ yw eich pŵer wedi’i luosi â’r oriau, wedi’i luosi â’r cyfartaledd hwnnw. Nid yw’r gost wedi’i chynnwys, gan nad yw prisiau cyfanwerthu’n cael eu rhagweld yn gyhoeddus.</p>"], ["acc", "Cywirdeb y rhagolygon", "<p>Bob bore tua 05:15 UTC, mae’r diweddariad dyddiol yn cadw rhagolwg cenedlaethol NESO ar gyfer y 24 awr nesaf. Ar ôl i’r 24 awr hynny fynd heibio, mae’n cymharu pob hanner awr â ffigur mesuredig NESO. Y <b>gwall arferol</b> yw maint cyfartalog y methiant i’r naill gyfeiriad neu’r llall, a’r <b>gogwydd</b> yw’r methiant cyfartalog gyda’i arwydd.</p><p>Mae “cyfnod glanaf wedi’i ganfod” yn gofyn y cwestiwn ymarferol y tu ôl i’r tab Cynllunio: pe baech wedi dechrau ar gyfnod 3 awr glanaf y rhagolwg, a fyddech o fewn 10 g i’r cyfnod glanaf go iawn? Mae’r cofnod yn cael ei gadw yn <code>data/accuracy.json</code> yn ystorfa’r map.</p>"], ["sim", "Efelychydd 2030", "<p>Mae’r efelychydd yn ail-chwarae un flwyddyn go iawn, awr wrth awr: y galw ac allbwn gwynt, solar, niwclear, biomas a dŵr o gymysgedd cynhyrchu hanesyddol NESO. Mae’n graddio allbwn pob awr yn ôl y capasiti rydych chi’n ei ddewis, o’i gymharu â’r capasiti a oedd yn bodoli go iawn y flwyddyn honno (o atodiad Cynllun Gweithredu Pŵer Glân 2030). Mae gwynt yn cael ei raddio yn ôl yr allbwn disgwyliedig, nid y capasiti yn unig, gan fod tyrbinau ar y môr yn cynhyrchu mwy am bob gigawat (40% o’r capasiti ar gyfartaledd, o’i gymharu â 27% ar y tir).</p><p>Bob awr, mae’n diwallu’r galw yn y drefn hon:</p><ol><li>cynhyrchu glân</li><li>batris (2 awr o storio, 85% yr holl ffordd) a storio hirdymor (8 awr, 75%)</li><li>pŵer carbon isel newydd ar alw (gan dybio 50 g/kWh)</li><li>mewnforion, yn dilyn patrwm yr un flwyddyn wedi’i raddio i’ch capasiti rhyng-gysylltu</li><li>nwy</li></ol><p>Mae pŵer dros ben yn gwefru’r storfeydd yn gyntaf, yna’n cael ei allforio (hyd at 60% o gapasiti’r rhyng-gysylltwyr), ac mae unrhyw beth sy’n weddill yn cael ei droi i lawr. Mae dwysedd carbon yn cyfrif cynhyrchu ym Mhrydain ynghyd â mewnforion, fel y mae ffigurau hanesyddol NESO yn ei wneud: nwy ar 394 g, biomas ar 120 g, tanwyddau eraill ar 300 g a mewnforion ar 50 g, i gyd am bob kWh. Ffigur y mewnforion yw’r un sy’n atgynhyrchu dwysedd carbon dyddiol 2024 orau, ac mae’n gweddu i fewnforion sy’n dod yn bennaf o ynni niwclear Ffrainc a dŵr Norwy.</p><p><b>Beth nad yw’n ei gynnwys:</b></p><ul><li>cyfyngiadau’r grid y tu mewn i Brydain, felly mae’n tanamcangyfrif cwtogi</li><li>y gweithfeydd nwy sydd eu hangen ar y grid er mwyn sefydlogrwydd</li><li>galw sy’n newid ei amseriad</li><li>tywydd blynyddoedd eraill</li><li>costau</li></ul><p>Mae gwirio’r model yn dangos pa mor agos y mae’n atgynhyrchu’r flwyddyn sylfaen go iawn: ar gyfer 2024 mae ei gyfartaledd o fewn tua 1 g i’r hyn a fesurwyd, ac mae ei ffigurau dyddiol fel arfer o fewn 5 g. Gyda chapasiti 2030 NESO mae’n glanio ychydig yn is na chanlyniad NESO ei hun o 95% glân, yn bennaf am nad yw’n symud unrhyw alw mewn amser. Mae senarios NESO yn dibynnu ar 10–12 GW o alw hyblyg, fel gwefru cerbydau trydan yn glyfar.</p>"], ["digest", "Crynodeb wythnosol", "<p>Bob dydd mae’r diweddariad yn gwirio a oes wythnos lawn o ddydd Llun i ddydd Sul (amser y DU) wedi dod i ben. Os oes, mae’n crynhoi’r wythnos honno o API Dwysedd Carbon NESO: y dwysedd a fesurwyd lle mae ar gael (y rhagolwg fel arall), y cymysgedd cynhyrchu a’r amcangyfrifon rhanbarthol. Mae’r testun yn cael ei ysgrifennu o’r rhifau hynny yn ôl rheolau penodol, nid â llaw. Mae’r recordiau’n cymharu â’r wythnosau sydd wedi’u cadw ers i’r crynodeb ddechrau, ac â’r hanner awr isaf yn hanes NESO ers 2009.</p>"], ["history", "Traciwr cwtogi a hanes gorsafoedd", "<p>Bob bore mae’r diweddariad yn darllen pob hanner awr o’r diwrnod blaenorol o Elexon: allbwn hysbysedig pob gorsaf, cyfarwyddiadau derbyniedig gweithredwr y grid a’r prisiau cynnig. Ar gyfer pob gorsaf ar y map, <b>troi i lawr</b> yw’r bwlch rhwng ei hallbwn hysbysedig a’r lefel y cafodd gyfarwyddyd iddi, ac mae’r <b>taliadau</b> yn defnyddio ei phris cynnig ar gyfer yr hanner awr honno. Mae’r cyfansymiau dyddiol yn cynnwys y ffermydd gwynt ar y map sydd ag uned Elexon hysbys, felly maen nhw’n tanamcangyfrif y cyfanswm i Brydain.</p><p>Mae hanes gorsaf yn dangos y 14 diwrnod diwethaf, awr wrth awr: yr allbwn hysbysedig, gyda’r rhan a gafodd ei throi i lawr wedi’i thywyllu. Mae’r traciwr yn cadw ffigurau dyddiol pob fferm wynt am tua phedwar mis a’r cyfansymiau dyddiol am ychydig dros ddwy flynedd.</p>"], ["records", "Recordiau a cherrig milltir", "<p>Daw recordiau Prydain o gymysgedd cynhyrchu hanesyddol NESO, fesul hanner awr ers 2009, wedi’i ddiweddaru’n ddyddiol. Mae pob record a charreg filltir yn defnyddio’r un set ddata honno, felly nid yw dim byth yn “record” dim ond am fod dau fesur yn wahanol. Mae carreg filltir yn ymddangos pan fydd diwrnod yn gosod record erioed, neu’n ddiwrnod glanaf am o leiaf 30 diwrnod.</p><p>Nid yw Cymru ar wahân yn y set ddata honno, felly mae rhes Cymru yn defnyddio amcangyfrifon rhanbarthol byw NESO, wedi’u cofnodi’n ddyddiol, a dim ond â hi ei hun y caiff ei chymharu.</p>"], ["share", "Rhannu golwg", "<p>Mae <b>Rhannu’r olwg hon</b> yn copïo dolen sy’n agor y map fel rydych chi’n ei weld: y tab, y safle neu’r rhanbarth a ddewiswyd, y flwyddyn, golwg Cymru, gosodiadau eich efelychydd neu wythnos y crynodeb. Does dim yn cael ei storio yn unman. Mae popeth yn y ddolen ei hun.</p>"], ["subsidy", "Prisiau diffodd a chynlluniau cymorth", "<p>Mae fferm wynt sy’n cael ei thalu i droi i lawr yn nodi ei phris yn y Mecanwaith Cydbwyso. Mae’r pris hwnnw’n fras yr incwm y mae’n ei golli drwy beidio â chynhyrchu, ac i’r rhan fwyaf o ffermydd gwynt cymhorthdal yw hwnnw:</p><ul><li><b>Rhwymedigaeth Ynni Adnewyddadwy</b> (ffermydd gwynt hŷn): mae pob MWh yn ennill tystysgrifau sy’n werth ymhell dros £50, yn aml mwy nag un am bob MWh ar y môr.</li><li><b>Contractau Gwahaniaeth cynnar</b> (contractau buddsoddi 2014): pris gwarantedig o £140–150/MWh ym mhrisiau 2012, ymhell uwchlaw’r farchnad heddiw, gydag atodiad ar bob MWh a gynhyrchir.</li><li><b>Contractau Gwahaniaeth drwy arwerthiant</b>: prisiau gwarantedig yn agos at bris y farchnad heddiw neu’n is, felly ychydig sy’n cael ei golli wrth ddiffodd.</li></ul><p>Y pris diffodd a ddangosir yw taliadau fferm wynt wedi’u rhannu â’r ynni y cafodd ei throi i lawr, dros y 30 diwrnod diwethaf. Mae ffermydd a gafodd eu troi i lawr o lai na 200 MWh wedi’u gadael allan, gan y gall ychydig o hanner awrau roi pris camarweiniol. Mae cynllun, blwyddyn a phris streic pob fferm wedi’u rhestru yn <code>data/subsidy.json</code>, gyda ffynonellau.</p>"], ["replay", "Ail-chwarae’r 7 diwrnod diwethaf", "<p>Mae’r ail-chwarae yn defnyddio’r hanes fesul awr y mae’r diweddariad dyddiol yn ei gadw ar gyfer pob gorsaf sy’n adrodd i Elexon: yr allbwn a gynlluniwyd a’r rhan y talodd gweithredwr y grid iddi ei throi i lawr. Yr allbwn a ddangosir ar y map yw’r allbwn a gynlluniwyd heb y troi i lawr. Mae safleoedd nad ydyn nhw’n adrodd i Elexon wedi’u cuddio, gan mai amcangyfrif ar gyfer y presennol fyddai eu hallbwn, nid ar gyfer yr awr honno.</p>"], ["queue", "Y ciw cysylltu", "<p>Mae cofrestr Capasiti Mynediad Trawsyrru (TEC) NESO yn rhestru pob prosiect sydd â chontract i gysylltu â’r grid trawsyrru. Mae’r diweddariad yn ei darllen bob dydd. Mae prosiect yn cyfrif fel un yn y ciw os yw ei gapasiti dan gontract i fod i gynyddu ac nad yw wedi’i nodi fel un wedi’i adeiladu. Mae NESO yn nodi bod rhywfaint o gapasiti’n cael ei ailadrodd ar draws camau a thechnolegau, felly mae rhesi gyda’r un prosiect, cam, maint a dyddiad yn cael eu cyfrif unwaith.</p><p>Mae pob safle cysylltu’n cael ei leoli ar y map drwy gyfateb ei enw ag is-orsafoedd a gorsafoedd pŵer yn OpenStreetMap, ac â safleoedd y map ei hun. Mae safleoedd na ellir eu cyfateb yn dal i gael eu cyfrif, ac yn cael eu rhestru fel rhai nad ydyn nhw ar y map. “Dyddiad contract wedi pasio” yw capasiti y mae ei ddyddiad cysylltu dan gontract eisoes yn y gorffennol ond nad yw wedi’i adeiladu. Mae llawer ohono’n aros i’r grid gael ei atgyfnerthu, nid am y datblygwr.</p><p>Nid yw contract i gysylltu yn addewid i adeiladu; nid yw llawer o brosiectau yn y ciw byth yn cael eu hadeiladu. Mae diwygio cysylltiadau yn ail-drefnu’r ciw yn brosiectau Porth 1 a Phorth 2, felly disgwyliwch newidiadau mawr.</p>"], ["official", "Gwirio’r traciwr yn erbyn NESO", "<p>Mae NESO yn cyhoeddi ei gostau cyfyngiadau dyddiol fesul categori bob wythnos. Mae’r traciwr yn cymharu ei daliadau dyddiol ei hun i ffermydd gwynt â chost <b>cyfyngiadau thermol</b> NESO, y categori sy’n cynnwys troi gwynt i lawr pan na all y grid gludo’i bŵer. Nid oes disgwyl i’r ddau gyfateb. Mae ffigur NESO hefyd yn cynnwys troi cynhyrchwyr eraill i fyny yn lle’r pŵer a gollwyd (nwy yn Lloegr fel arfer), masnachu, a ffermydd gwynt nad yw’r map hwn yn eu tracio. Dylai’r gyfran fod yn weddol sefydlog; mae newid sydyn yn arwydd bod rhywbeth wedi mynd o’i le, yn y naill set ddata neu’r llall.</p>"], ["wales", "Cymru yn erbyn ei thargedau", "<p>Mae Llywodraeth Cymru yn mesur ei thargedau fel cynhyrchu adnewyddadwy yng Nghymru mewn blwyddyn, wedi’i rannu â’r trydan a ddefnyddiwyd yng Nghymru yn y flwyddyn honno. Daw’r ffigurau o’i hadroddiad <i>Cynhyrchu Ynni a Defnyddio Ynni yng Nghymru</i> (argraffiad 2026, data hyd at 2024). Mae’r adroddiad yn rhoi 54% mewn rhai mannau a 55% mewn eraill; mae’r map yn defnyddio 54%, y ffigur yn y datganiad gweinidogol. Daw’r cymysgedd byw yng Nghymru o amcangyfrifon rhanbarthol NESO, sy’n mesur rhywbeth gwahanol (cymysgedd y trydan a ddefnyddir yng Nghymru bob hanner awr), felly ni ellir ei gymharu’n uniongyrchol â’r targedau.</p>"], ["hydrogen", "Prosiectau a phiblinell hydrogen", "<p>Mae’r haen hon wedi’i llunio â llaw, nid ei thynnu o ffrwd fyw, gan nad oes set ddata gyhoeddus sy’n cwmpasu prosiectau a phiblinellau hydrogen. Yr 11 enillydd yn rownd dyrannu hydrogen gyntaf y llywodraeth (DESNZ, Rhagfyr 2023) yw’r prosiectau electrolysydd. Daw eu statws o adroddiadau diweddarach: cyhoeddiadau cwmnïau, y wasg fasnach a thraciwr annibynnol (HyCalc), i gyd wedi’u cysylltu ar bob cofnod. Mae “contract wedi’i lofnodi” yn golygu bod contract rownd gyntaf wedi’i lofnodi yn 2025; ni chadarnhawyd y cynnydd wedi hynny fesul prosiect. Mae’r safleoedd yn fras, ar lefel tref neu glwstwr.</p><p>Cyfeiriad bras yw’r llinell biblinell rhwng Teesside, yr Humber a Dwyrain Canolbarth Lloegr, wedi’i thynnu o ddisgrifiad National Gas o Project Union: East Coast. Nid y llwybr a arolygwyd ydyw. Mae rhestr fer yr ail rownd (27 prosiect, 765 MW, Ebrill 2025) yn cael ei chyfrif yn y testun ond nid ei mapio, gan na chafodd ei safleoedd eu gwirio.</p><p>Mae cynlluniau hydrogen yn newid yn gyflym, a chafodd sawl prosiect eu gohirio neu eu canslo yn 2025. Mae pob cofnod yn dangos pryd y cafodd ei statws ei wirio ddiwethaf. Ystyriwch yr haen fel cipolwg a gwiriwch y ffynonellau cysylltiedig. Mae popeth yn <code>data/hydrogen.json</code> gyda ffynonellau, ac mae croeso i gywiriadau.</p>"], ["open", "Data agored", "<p>Mae popeth y mae’r map yn ei gasglu yn cael ei gyhoeddi fel ffeiliau CSV, wedi’u diweddaru’n ddyddiol, mewn cyfeiriadau sefydlog. Mae <a href=\"data/open/index.json\">index.json</a> yn disgrifio pob ffeil, ei cholofnau a’i thrwydded.</p><ul><li><a href=\"data/open/curtailment-daily.csv\" download>Gwynt wedi’i droi i lawr, cyfansymiau dyddiol</a> <code>curtailment-daily.csv</code></li><li><a href=\"data/open/curtailment-by-windfarm.csv\" download>Gwynt wedi’i droi i lawr, fesul fferm wynt, gyda’r cynllun cymorth a £/MWh</a> <code>curtailment-by-windfarm.csv</code></li><li><a href=\"data/open/station-output-hourly.csv\" download>Allbwn gorsafoedd a throi i lawr, fesul awr, y 14 diwrnod diwethaf</a> <code>station-output-hourly.csv</code></li><li><a href=\"data/open/carbon-daily.csv\" download>Dwysedd carbon a chyfran y gwynt, yn ddyddiol</a> <code>carbon-daily.csv</code></li><li><a href=\"data/open/weekly-digest.csv\" download>Crynodeb wythnosol</a> <code>weekly-digest.csv</code></li><li><a href=\"data/open/forecast-accuracy.csv\" download>Cywirdeb y rhagolygon</a> <code>forecast-accuracy.csv</code></li><li><a href=\"data/open/records.csv\" download>Recordiau trydan Prydain</a> <code>records.csv</code></li><li><a href=\"data/open/connection-queue-by-site.csv\" download>Ciw cysylltu, fesul safle cysylltu</a> <code>connection-queue-by-site.csv</code></li><li><a href=\"data/open/official-constraint-costs.csv\" download>Costau cyfyngiadau NESO wrth ymyl y taliadau gwynt sy’n cael eu tracio</a> <code>official-constraint-costs.csv</code></li><li><a href=\"data/open/hydrogen-projects.csv\" download>Prosiectau a phiblinell hydrogen, gyda statws</a> <code>hydrogen-projects.csv</code></li></ul><p><b>Trwydded.</b> Mae’r ffeiliau hyn yn cael eu rhannu dan <a href=\"https://creativecommons.org/licenses/by/4.0/deed.cy\" target=\"_blank\" rel=\"noopener\">CC BY 4.0</a>: gallwch eu copïo, eu rhannu, eu haddasu a’u defnyddio, gan gynnwys yn fasnachol, cyn belled â’ch bod yn rhoi cydnabyddiaeth. Mae’r ffeil ciw cysylltu yn eithriad: mae’n cynnwys lleoliadau sy’n deillio o OpenStreetMap, felly mae’n cael ei rhannu dan y <a href=\"https://opendatacommons.org/licenses/odbl/1-0/\" target=\"_blank\" rel=\"noopener\">Drwydded Cronfa Ddata Agored (ODbL)</a> yn lle hynny.</p><p><b>Sut i gydnabod.</b> “Llif Pŵer y DU, gan Daniel Elwyn Thomas” gyda dolen i’r wefan hon, er enghraifft: <i>Data: Llif Pŵer y DU (Daniel Elwyn Thomas), CC BY 4.0.</i></p><p><b>Y ffynonellau gwreiddiol.</b> Daw’r rhifau sydd oddi tano gan eraill, ac mae eu telerau nhw’n berthnasol hefyd: NESO (Trwydded Data Agored NESO), Elexon (yn cynnwys data BMRS © hawlfraint a hawl cronfa ddata Elexon Limited), a chyfranwyr OpenStreetMap (ODbL). Y casgliad sy’n cael ei drwyddedu yma: y tracio dyddiol, y paru a’r cyfrifiadau. Daw’r data heb warant, felly gwiriwch unrhyw beth pwysig yn erbyn y ffynonellau gwreiddiol.</p>"], ["limits", "Cyfyngiadau hysbys", "<ul><li>Targedau datblygwyr neu’r llywodraeth yw’r dyddiadau yn y dyfodol, ac maen nhw’n aml yn llithro.</li><li>Gwirfoddolwyr sy’n mapio OpenStreetMap, felly mae rhai cofnodion wedi dyddio.</li><li>Mae gan Ogledd Iwerddon grid ar wahân sy’n cael ei rannu ag Iwerddon.</li><li>Mae allbynnau amcangyfrifedig yn tybio bod pob safle o’r un dechnoleg yn rhedeg yr un mor galed, sydd byth yn hollol wir.</li></ul>"]]};

function fitPts(ll, kmax=7){
  const pts=ll.map(P0), vh=visH();
  const x=d3.extent(pts,p=>p[0]), y=d3.extent(pts,p=>p[1]);
  const dx=Math.max(x[1]-x[0],40), dy=Math.max(y[1]-y[0],40);
  const k=Math.max(1,Math.min(kmax,.62*Math.min(W/dx,(vh-100)/dy)));
  const cx=(x[0]+x[1])/2, cy=(y[0]+y[1])/2;
  const t=d3.zoomIdentity.translate(W/2-k*cx,(vh-40)/2-k*cy).scale(k);
  svg.transition().duration(matchMedia('(prefers-reduced-motion: reduce)').matches?0:650).call(zoom.transform,t);
}

}

function addHover(sv,x,series,cfg){

      else dots[i].style('display','none'); });
    txt.selectAll('tspan').data(lines).join('tspan').attr('x',8).attr('dy',(d,i)=>i?16:14).attr('font-weight',(d,i)=>i?500:700).text(d=>d);
    const bb=txt.node().getBBox(); bg.attr('width',bb.width+16).attr('height',bb.height+10);

function planWindows(s,n){

  if(!s||s.length<4){ s=LIVE.ci.series.filter(d=>d.f!=null&&d.t+1800000>Date.now()).map(d=>({t:d.t,f:d.f})); src=P.reg?'fallback':'snap'; }

const CI='https://api.carbonintensity.org.uk', ELX='https://data.elexon.co.uk/bmrs/api/v1';
async function getJSON(url,ms=9000){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{ const r=await fetch(url,{signal:c.signal,headers:{Accept:'application/json'}}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); } finally{ clearTimeout(t); } }
const arr = x => Array.isArray(x)?x:(x&&Array.isArray(x.data)?x.data:[]);
const mixObj = gm => { const m={}; (gm||[]).forEach(f=>m[f.fuel]=+f.perc||0); return m; };
function ukNow(){ const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g=k=>f.find(p=>p.type===k).value; const hh=+g('hour')%24, mm=+g('minute');
  return {date:`${g('year')}-${g('month')}-${g('day')}`, sp:Math.floor((hh*60+mm)/30)+1}; }
const bmuId = r => String(r.nationalGridBmUnit||r.bmUnit||r.bmUnitId||'').replace(/^[TE]_/,'').toUpperCase();
function levelAt(recs, now){ // recs for one BMU: pick the segment covering now, else latest
  let best=null;
  for(const r of recs){ const a=Date.parse(r.timeFrom), b=Date.parse(r.timeTo); const lf=+r.levelFrom, lt=+r.levelTo;
    if(!isNaN(a)&&!isNaN(b)&&a<=now&&now<=b) return b>a? lf+(lt-lf)*(now-a)/(b-a) : lt;
    if(!best||Date.parse(r.timeTo)>Date.parse(best.timeTo)) best=r; }
  return best? +best.levelTo : null;
}
function bySite(levels){ const out={};
  for(const s of SITES){ if(!s.bmu) continue; let sum=0,n=0;
    for(const id in levels){ if(s.bmu.some(p=>id.startsWith(p))){ sum+=levels[id]; n++; } }
    if(n) out[s.id]=sum; }
  return out; }

    ci_48: async()=>{ const iso=new Date(now).toISOString().slice(0,16)+'Z';
      const [b,f]=await Promise.all([getJSON(CI+'/intensity/'+iso+'/pt24h'),getJSON(CI+'/intensity/'+iso+'/fw48h')]);
      const m=new Map(); [...arr(b),...arr(f)].forEach(d=>{ const t=Date.parse(d.from); if(!isNaN(t)) m.set(t,{t,f:d.intensity&&d.intensity.forecast,a:d.intensity&&d.intensity.actual}); });
      const s=[...m.values()].sort((a,b)=>a.t-b.t); if(s.length<10) throw new Error('short'); LIVE.ci.series=s; LIVE.ci.live=true; },
    ci_reg: async()=>{ const x=await getJSON(CI+'/regional'); const d=arr(x)[0]; const v={}; const mx={}; (d.regions||[]).forEach(r=>{ if(r.regionid<=14&&r.intensity){ v[r.regionid]=r.intensity.forecast; if(r.generationmix) mx[r.regionid]=mixObj(r.generationmix); } }); if(!Object.keys(v).length) throw new Error('empty'); const gbr=(d.regions||[]).find(r=>r.regionid===18); LIVE.reg={from:d.from,v,mix:mx,gb:gbr&&gbr.intensity?gbr.intensity.forecast:null}; },

    elx_mid: async()=>{ const iso=ms=>new Date(ms).toISOString().slice(0,19)+'Z';

      const p=arr(x).map(r=>({t:Date.parse(r.startTime||r.timeFrom||r.settlementDate),p:+r.price,v:+(r.volume??1)})).filter(r=>!isNaN(r.t)&&!isNaN(r.p)&&r.v>0).sort((a,b)=>a.t-b.t);

    ci_nat: async()=>{ const x=await getJSON(CI+'/generation'); const d=Array.isArray(x.data)?x.data[0]:x.data; LIVE.nat={from:d.from,mix:mixObj(d.generationmix)}; },
    ci_wales: async()=>{ const x=await getJSON(CI+'/regional/wales'); const r=arr(x)[0]; const d=(r.data||[])[0]||r; LIVE.wales={from:d.from,mix:mixObj(d.generationmix),ci:d.intensity&&d.intensity.forecast,idx:d.intensity&&d.intensity.index}; },
    ci_hist: async()=>{ const iso=new Date(now).toISOString().slice(0,16)+'Z'; const x=await getJSON(CI+'/generation/'+iso+'/pt24h'); const h=arr(x).filter(d=>d&&d.generationmix).map(d=>({from:d.from,mix:mixObj(d.generationmix)})); h.sort((a,b)=>a.from<b.from?-1:1); if(h.length>2) LIVE.hist=h; else throw new Error('empty'); },
    elx_cur: async()=>{ const x=await getJSON(ELX+'/generation/outturn/current'); const ic={}; let tot=0;

      if(!Object.keys(ic).length) throw new Error('no interconnectors'); LIVE.ic=ic; if(tot>10000) LIVE.demandGW=Math.min(50,tot/1000*1.12); },

    elx_boa: async()=>{ if(!LIVE._pnLevels) throw new Error('needs PN');

      const cut={}; for(const id in g){ const pn=LIVE._pnLevels[id]; if(pn==null) continue; const acc=levelAt(g[id],now); if(acc!=null&&pn-acc>0) cut[id]=pn-acc; }
      const bs=bySite(cut); const out={}; for(const k in bs){ const s=SITES.find(x=>x.id===k); if(s&&(s.t==='ow'||s.t==='nw')) out[k]=bs[k]; } LIVE.curt=out; LIVE._cutIds=cut; },
    elx_bod: async()=>{ if(!LIVE._cutIds||!Object.keys(LIVE._cutIds).length){ LIVE.curtPay={}; LIVE.curtBid={}; return 'skip'; }

      const bid={}; arr(x).forEach(r=>{ const id=bmuId(r), p=+r.pairId; if(!id||!(p<0)||r.bid==null) return; if(!bid[id]||p>bid[id].p) bid[id]={p,b:+r.bid}; });

async function checkPostcode(q){

    catch(e){ const oc=q.replace(/\s+/g,' ').split(' ')[0]; const r=await getJSON('https://api.postcodes.io/outcodes/'+encodeURIComponent(oc)); lat=r.result.latitude; lon=r.result.longitude; outcode=r.result.outcode; }
    S.pc.c=[lat,lon]; S.pc.label=q;
    S.pc.near=SITES.filter(d=>active(d)&&S.types.has(d.t)).map(d=>({d,km:hav([lat,lon],d.c)})).sort((a,b)=>a.km-b.km).slice(0,3);
    try{ const x=await getJSON(CI+'/regional/postcode/'+encodeURIComponent(outcode)); const r=arr(x)[0]; const d=(r.data||[])[0]||r; S.pc.region=r.shortname||outcode; S.pc.ci=d.intensity&&d.intensity.forecast; S.pc.idx=d.intensity&&d.intensity.index; }catch(e){}
    try{ const iso=new Date().toISOString().slice(0,16)+'Z'; const x=await getJSON(CI+'/regional/intensity/'+iso+'/fw24h/postcode/'+encodeURIComponent(outcode)); const r=Array.isArray(x.data)?x.data[0]:x.data; const ps=(r&&r.data)||[];

const sheet=document.getElementById('sheet'), grab=document.getElementById('grab'), mapwrap=document.querySelector('.mapwrap'), stage=document.querySelector('.stage');
let sheetState='half';
const isSheet = () => matchMedia('(max-width: 899px) and (orientation: portrait), (max-width: 699px)').matches;
const sheetSizes = () => { const h=stage.clientHeight; return {peek:Math.min(isPhone()?132:150,h*.3), half:Math.round(h*(isPhone()?.42:.44)), full:h-8}; };
const sheetPx = () => isSheet() ? sheet.getBoundingClientRect().height : 0;

function applySheet(px){ if(!isSheet()){ sheet.style.removeProperty('height'); mapwrap.style.setProperty('--sheet','0px'); stage.style.removeProperty('--sheet'); return; }
  stage.style.setProperty('--sheet',px+'px'); mapwrap.style.setProperty('--sheet',px+'px'); sheet.style.height=px+'px'; }

function placeSearch(){ const s=document.querySelector('.search'), tools=document.querySelector('.tools'), sh=document.getElementById('sheet'), pnl=document.getElementById('panel');
  if(!s||!sh) return;
  const yb=document.querySelector('.yearbar'), mw=document.querySelector('.mapwrap'), ctl=document.querySelector('.ctl'), coach=document.getElementById('coach');
  const wb=document.getElementById('walesbtn'), lb=document.getElementById('langbtn'), lay=document.getElementById('layersbtn'), tb=document.getElementById('tablebtn');

  } else {
    s.classList.remove('insheet'); if(s.parentNode!==tools) tools.insertBefore(s,tools.firstChild);

  }

(function(){ let y0=0,h0=0,t0=0,drag=false;
  grab.addEventListener('pointerdown',e=>{ if(!isSheet()) return; drag=true; y0=e.clientY; h0=sheet.getBoundingClientRect().height; t0=performance.now(); sheet.classList.add('dragging'); grab.setPointerCapture(e.pointerId); });
  grab.addEventListener('pointermove',e=>{ if(!drag) return; const s=sheetSizes(); applySheet(Math.max(s.peek*.7,Math.min(s.full,h0-(e.clientY-y0)))); });
  const end=e=>{ if(!drag) return; drag=false; sheet.classList.remove('dragging');
    const s=sheetSizes(), h=sheet.getBoundingClientRect().height, dy=e.clientY-y0, v=dy/Math.max(1,performance.now()-t0);
    if(Math.abs(dy)<6){ setSheet(sheetState==='peek'?'half':sheetState==='half'?'full':'peek'); return; }
    let st = v<-.5 ? (sheetState==='peek'?'half':'full') : v>.5 ? (sheetState==='full'?'half':'peek') : Object.entries(s).sort((a,b)=>Math.abs(a[1]-h)-Math.abs(b[1]-h))[0][0];
    setSheet(st); };
  grab.addEventListener('pointerup',end); grab.addEventListener('pointercancel',end);
  grab.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setSheet(sheetState==='peek'?'half':sheetState==='half'?'full':'peek'); } });
})();

function accBlock(){
  const A=ACCURACY, d=(A.days||[]).slice(-30);
  let h=`<h3>${tr('acc_h')}</h3>`;
  if(!d.length) return h+`<p class="meta">${A.since?tr('acc_wait',{d:fmtDate(A.since)}):tr('acc_none')}</p><button class="linkbtn" data-methods="acc">${tr('m_link')}</button>`;
  const mae=d3.mean(d,x=>x.mae), bias=d3.mean(d,x=>x.bias), w20=d3.mean(d,x=>x.w20), hit=d.filter(x=>x.gap<=10).length;
  h+=`<p>${tr('acc_t',{n:d.length})}</p><div class="cibig"><div><b>±${Math.round(mae)}</b><small>gCO₂/kWh</small><span>${tr('acc_mae')}</span></div>
    <div><b>${Math.round(w20)}%</b><small>${tr('acc_hh')}</small><span>${tr('acc_w20')}</span></div>
    <div><b>${hit}/${d.length}</b><small>${tr('acc_days')}</small><span>${tr('acc_hit')}</span></div></div>`;
  h+=`<p>${Math.abs(bias)<3?tr('acc_bias0'):tr(bias>0?'acc_bias_hi':'acc_bias_lo',{v:Math.round(Math.abs(bias))})}</p>`;
  h+=`<div class="key"><span><i class="sq" style="background:var(--muted)"></i>${tr('acc_key')}</span></div><div class="chart" id="chacc"></div>`;
  h+=`<p class="fine">${tr('acc_note',{d:fmtDate(A.since)+' '+A.since.slice(0,4)})} <button class="linkbtn inl" data-methods="acc">${tr('m_link')}</button></p>`;
  return h;
}

  const w=el.clientWidth||320, h=o.h||110, m={l:30,r:8,t:10,b:20};

/* ======================= 2030 simulator ======================= */
const SIM_K={imp:50,cfOff:.40,cfOn:.27,batH:2,ldH:8,etaB:.85,etaL:.75,exp:.6,gas:394,bio:120,oth:300,lcd:50,gasHeavy:.25};
const SIM_SL=[['off',0,90,1],['on',0,45,1],['solar',0,90,1],['nuclear',0,10,.1],['bat',0,50,1],['ldes',0,20,.5],['ic',0,30,.5],['lcd',0,20,.5],['dem',-10,40,1]];
const SIM_RANGE={off:[43,50],on:[27,29],solar:[45,47],nuclear:[3,4],bat:[23,27],ldes:[4,6],ic:[12,14],dem:[10,12]};
const SIM_PRESETS={ffr:{off:51,on:27,solar:47,nuclear:4,bat:27,ldes:8,ic:12,lcd:0,dem:11},nd:{off:43,on:27,solar:47,nuclear:4,bat:23,ldes:5,ic:12,lcd:3,dem:11}};
const S_SIM={data:null,loading:false,err:null,v:null,preset:'ffr',res:null,base:null};
const B64I=(()=>{ const m=new Int16Array(128); 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'.split('').forEach((c,i)=>m[c.charCodeAt(0)]=i); return m; })();
function unpack(s,u){ const n=s.length>>1, a=new Float32Array(n); for(let i=0;i<n;i++) a[i]=((B64I[s.charCodeAt(2*i)]<<6)|B64I[s.charCodeAt(2*i+1)])*u; return a; }
const simBase = () => { const c=S_SIM.data.cap; return {off:c.off,on:c.on,solar:c.solar,nuclear:c.nuclear,bat:c.bat,ldes:c.ldes,ic:c.ic,lcd:0,dem:0}; };
async function loadSim(){
  const P=S_SIM; if(P.data||P.loading||P.err) return; P.loading=true;
  try{
    let j=SIM_INLINE;
    if(!j){ const r=await fetch('data/sim.json',{cache:'no-cache'}); if(!r.ok) throw new Error('fetch'); j=await r.json(); }
    if(!j||!j.s||!j.s.d){ P.err='nodata'; }
    else { const s={}; for(const k in j.s) s[k]=unpack(j.s[k],j.unit); P.data={...j,s}; P.base=simRun(P.data,simBase()); P.v=P.v||{...SIM_PRESETS.ffr}; P.res=simRun(P.data,P.v); }
  }catch(e){ P.err=location.protocol.startsWith('http')?'nodata':'offline'; }
  P.loading=false; if(S.tab==='sim'&&!S.sel&&S.view!=='wales') panel();
}
function simRun(D,v){
  const c=D.cap, s=D.s, H=D.hours, K=SIM_K;
  const kW=(v.off*K.cfOff+v.on*K.cfOn)/(c.off*K.cfOff+c.on*K.cfOn), kS=v.solar/c.solar, kN=v.nuclear/c.nuclear, kD=1+v.dem/100, kI=v.ic/c.ic;
  const bP=v.bat*1e3, bE=bP*K.batH, lP=v.ldes*1e3, lE=lP*K.ldH, xP=v.ic*1e3*K.exp, cP=v.lcd*1e3;
  let sb=bE/2, sl=lE/2;
  const T={gen:0,clean:0,gas:0,curt:0,ws:0,exp:0,imp:0,dem:0,h50:0,gasH:0};
  const nd=Math.floor(H/24), daily=new Float32Array(nd), dgas=new Float32Array(nd), dcurt=new Float32Array(nd);
  let run=0, runStart=0, best={len:0,start:0};
  for(let h=0;h<H;h++){
    const d=s.d[h]*kD, ws=s.w[h]*kW+s.so[h]*kS, n=s.n[h]*kN, b=s.b[h], hy=s.hy[h], ot=s.ot[h];
    let r=d-(ws+n+b+hy+ot), wsU=ws, nU=n, gas=0, lc=0, cu=0, im=0;
    if(r<0){ let sur=-r, x;
      x=Math.min(sur,bP,(bE-sb)/K.etaB); sb+=x*K.etaB; sur-=x;
      x=Math.min(sur,lP,(lE-sl)/K.etaL); sl+=x*K.etaL; sur-=x;
      x=Math.min(sur,xP); T.exp+=x; sur-=x;
      cu=sur; wsU=Math.max(0,ws-sur); nU=n-Math.max(0,sur-ws); T.curt+=Math.min(sur,ws);
    } else { let x;
      x=Math.min(r,bP,sb); sb-=x; r-=x;
      x=Math.min(r,lP,sl); sl-=x; r-=x;
      lc=Math.min(r,cP); r-=lc;
      x=Math.min(r,s.im[h]*kI); T.imp+=x; r-=x; im=x;
      gas=r;
    }
    const clean=wsU+nU+b+hy+lc, gen=clean+gas+ot, em=gas*K.gas+b*K.bio+ot*K.oth+lc*K.lcd+im*K.imp, ci=gen+im>0?em/(gen+im):0;
    T.gen+=gen; T.clean+=clean; T.gas+=gas; T.ws+=ws; T.dem+=d; if(ci<=50) T.h50++; if(gas>500) T.gasH++;
    const di=Math.floor(h/24); if(di<nd){ daily[di]+=ci/24; dgas[di]+=gas; dcurt[di]+=Math.min(cu,ws); }
    if(gen>0&&gas/gen>=K.gasHeavy){ if(!run) runStart=h; run++; if(run>best.len) best={len:run,start:runStart}; } else run=0;
  }
  const ciMean=d3.mean(daily);
  return {ci:ciMean, cleanShare:T.clean/T.gen*100, cleanDem:T.clean/T.dem*100, gas:T.gas/1e6, curt:T.curt/1e6, curtPct:T.ws?T.curt/T.ws*100:0,
    exp:T.exp/1e6, imp:T.imp/1e6, h50:T.h50/H*100, gasH:T.gasH/H*100, spell:best, daily, dgas, dcurt};
}

/* ======================= weekly digest ======================= */
const EN_DF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], CY_DF=['dydd Sul','dydd Llun','dydd Mawrth','dydd Mercher','dydd Iau','dydd Gwener','dydd Sadwrn'];
const dayName = ds => (LANG==='cy'?CY_DF:EN_DF)[new Date(ds+'T12:00:00Z').getUTCDay()];
const addDays = (ds,n) => new Date(Date.parse(ds+'T12:00:00Z')+n*864e5).toISOString().slice(0,10);
function dgWeek(){ const W=(DIGEST.weeks||[]).map(w=>{ const e=addDays(w.start,6); return {...w,days:w.days.filter(d=>d[0]>=w.start&&d[0]<=e)}; }); if(!W.length) return null;
  const i=S.dw==null?W.length-1:Math.max(0,Math.min(W.length-1,S.dw)); return {w:W[i],i,W}; }
function dgRange(w){ const e=addDays(w.start,6), a=fmtDate(w.start), z=fmtDate(e);
  return w.start.slice(5,7)===e.slice(5,7) ? `${a.split(' ')[0]}–${z} ${e.slice(0,4)}` : `${a} – ${z} ${e.slice(0,4)}`; }
function dgFacts(x){
  const {w,i,W}=x, out=[];
  const prev=W[i-1]&&W[i-1].start===addDays(w.start,-7)?W[i-1]:null;
  let cmp=''; if(prev){ const p=Math.round((w.ci-prev.ci)/prev.ci*100); cmp=Math.abs(p)<3?tr('dg_same'):tr(p<0?'dg_cleaner':'dg_dirtier',{p:Math.abs(p)}); }
  out.push(tr('dg_s1',{ci:w.ci,cmp}));
  if(w.mix){ const pk=w.pk&&w.pk.wind; out.push(tr('dg_s2',{w:Math.round(w.mix.wind),pk:pk?pk[0]:'–',when:pk?fmtWhen(pk[1]):''})); }
  const lo=w.days.reduce((a,b)=>b[1]<a[1]?b:a), hi=w.days.reduce((a,b)=>b[1]>a[1]?b:a);
  out.push(tr('dg_s3',{d1:dayName(lo[0]),v1:lo[1],d2:dayName(hi[0]),v2:hi[1]}));
  out.push(w.h50>0?tr('dg_s4',{h:Math.round(w.h50)}):tr('dg_s4n'));
  if(w.reg){ const rs=REG.map(r=>[r,w.reg[r[0]]]).filter(e=>e[1]!=null).sort((a,b)=>a[1]-b[1]);
    if(rs.length){ const r=rs[0], wv=w.reg['17']; let s=tr('dg_s5',{r:LANG==='cy'?r[0][2]:r[0][1],v:r[1]});
      if(wv!=null){ const p=Math.round((wv-w.ci)/w.ci*100); s+=' '+(Math.abs(p)<3?tr('dg_wal0',{v:wv}):tr(p<0?'dg_wal_lo':'dg_wal_hi',{v:wv,p:Math.abs(p)})); }
      out.push(s); } }
  const [yy,mm]=w.start.split('-').map(Number), ly=CI_MON.find(d=>d[0]===yy-1&&d[1]===mm);
  if(ly) out.push(tr('dg_ly',{v:ly[2],m:fmtDate(w.start).replace(/^\d+ /,''),y:yy-1}));
  const rec=[];
  if(W.length>=6&&w.ci===Math.min(...W.map(z=>z.ci))) rec.push(tr('dg_rec',{d:fmtDate(W[0].start)+' '+W[0].start.slice(0,4)}));
  if(HISTORY.record&&w.min[0]<HISTORY.record.v) rec.push(tr('dg_rec_hh',{v:w.min[0]}));
  return {out,rec,lo,hi};
}
function digestBlock(){
  const x=dgWeek();
  if(!x) return `<div class="digest"><h3>${tr('dg_h')}</h3><p class="meta">${tr('dg_none')}</p></div>`;
  const {w,i,W}=x, F=dgFacts(x);
  let h=`<div class="digest"><div class="dghead"><div><h3>${i===W.length-1?tr('dg_h'):tr('dg_h_old')}</h3><div class="meta">${dgRange(w)}</div></div>
    <div class="dgnav"><button class="xbtn" data-dg="-1" aria-label="${tr('dg_prev')}" ${i===0?'disabled':''}>‹</button><button class="xbtn" data-dg="1" aria-label="${tr('dg_next')}" ${i===W.length-1?'disabled':''}>›</button></div></div>
    <div class="cibig"><div><b>${w.ci}</b><small>gCO₂/kWh</small><span><i class="rdot" style="--c:${CI_IDX_COL[ciIndex(w.ci)]}"></i>${tr('dg_avg')}</span></div>
    <div><b>${Math.round(w.h50)}</b><small>${tr('dg_hours')}</small><span>${tr('dg_at50')}</span></div>
    <div><b>${w.mix?Math.round(w.mix.wind)+'%':'–'}</b><small>${tr('dg_ofgen')}</small><span>${tr('fuel_wind')}</span></div></div>
    <div class="chart" id="chdg"></div>
    <ul class="simtxt">${F.out.map(s=>`<li>${s}</li>`).join('')}</ul>
    ${F.rec.length?`<p class="dgrec">${F.rec.join(' ')}</p>`:''}`;
  if(canSave()) h+=`<div class="row dgact"><button class="pbtn ghost" id="dgimg">${tr('dg_img')}</button><button class="pbtn ghost" id="dgshare">${navigator.share?tr('dg_share'):tr('dg_copy')}</button>${csvButton('digest')}</div>`;
  h+=`<p class="fine">${tr('dg_src')} <button class="linkbtn inl" data-methods="digest">${tr('m_link')}</button></p></div>`;
  return h;
}
function wireDigest(){
  const x=dgWeek(); if(!x) return;
  $p.querySelectorAll('[data-dg]').forEach(b=>b.onclick=()=>{ S.dw=x.i+(+b.dataset.dg); const y=$p.scrollTop; storiesPanel(); $p.scrollTop=y; syncHash(); });

  const bi=document.getElementById('dgimg'); if(bi) bi.onclick=async()=>{ const b=await dgImage(x); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`uk-grid-week-${x.w.start}.png`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); };
  const bs=document.getElementById('dgshare'); if(bs) bs.onclick=async()=>{
    const txt=dgShareText(x);
    if(navigator.share){ try{ const b=await dgImage(x), f=new File([b],`uk-grid-week-${x.w.start}.png`,{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[f]})) await navigator.share({files:[f],text:txt}); else await navigator.share({text:txt,url:location.href.split('#')[0]}); }catch(e){} }

const LAZY={};
function lazyJSON(name){ return LAZY[name]||(LAZY[name]=fetch(`data/${name}.json`,{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null)); }
const HIST={cur:null,sta:null,day:null,queue:null,con:null,ready:{}};
const HIST_FILE={cur:'curtail',sta:'stations',day:'daily',queue:'queue',con:'constraints'};
function need(names,after){ const todo=names.filter(n=>!HIST.ready[n]); if(!todo.length) return true;
  Promise.all(todo.map(n=>lazyJSON(HIST_FILE[n]).then(j=>{ HIST[n]=j; HIST.ready[n]=true; }))).then(after); return false; }
